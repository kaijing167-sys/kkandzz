<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ⅱ 阴阳五行 · 星界守望</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="page-shell">
  <!-- 子页面面包屑顶栏 -->
  <header class="topbar">
    <div class="nav-left">
      <a class="pill-btn" href="index.html">← 返回主页面</a>
      <span class="crumb-sep">/</span>
      <span class="crumb-cur">Ⅱ 阴阳五行</span>
    </div>
    <a class="pill-btn" href="universe-science.html">← 上一宇宙：科学纪元</a>
  </header>

  <main class="codex-layout">
    <!-- 左：无文字实时动态黑白双水脉沙盘 -->
    <section class="board-panel">
      <div class="board-header wuxing-head">
        <h1>阴阳五行</h1>
        <span class="tag-badge">第二宇宙</span>
      </div>

      <div class="live-stage wx-bg">
        <canvas id="wxMiniCanvas" aria-label="阴阳五行双水脉动态演示"></canvas>
      </div>

      <div class="visual-strip">
        <div class="v-chip"><span style="font-size:15px">🔥→⚔️</span><span>火克金</span></div>
        <div class="v-chip"><span style="font-size:15px">⚔️→🎋</span><span>金克木</span></div>
        <div class="v-chip"><span style="font-size:15px">⛰️→🌊</span><span>土克水</span></div>
        <div class="v-chip"><span style="font-size:15px">🌊→🏮</span><span>水克火</span></div>
      </div>
    </section>

    <!-- 右：十天干 & 灵怪 & 相生连线 -->
    <section class="deck-panel">
      <div class="tab-bar" role="tablist">
        <button class="tab-pill" role="tab" aria-selected="true" data-tab="stems">十天干</button>
        <button class="tab-pill" role="tab" aria-selected="false" data-tab="enemies">五行灵怪</button>
        <button class="tab-pill" role="tab" aria-selected="false" data-tab="cycle">相生连线</button>
      </div>

      <div data-panel="stems">
        <div class="stems-grid" id="wuxingStems">
          <div class="stem-line">
            <span class="wx-chip">金</span>
            <button class="stem-tile yin" aria-pressed="true" data-title="辛金 · 银簪" data-tag="阴金 · 破甲" data-desc="精准破甲点杀；金克木，斩断缠藤竹灵回血。">
              <svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 34 27 16 12 34Z M26 17C17 17 18 9 23 10Q25 10 26 14C23 4 32 4 31 11Q30 14 28 15C36 9 39 17 32 19Q29 20 26 17Z"/></svg>
              <span><span class="stem-name">辛金</span><span class="stem-tag">银簪</span></span>
            </button>
            <button class="stem-tile yang" aria-pressed="false" data-title="庚金 · 铜钟" data-tag="阳金 · 震退" data-desc="声波击退；邻土激活「土生金」强化破甲。">
              <svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 11q0-7 5-7t5 7 M13 14q9-5 18 0l2 14 3 4q-14-4-28 0l3-5Z M13 18q9-4 18 0"/></svg>
              <span><span class="stem-name">庚金</span><span class="stem-tag">铜钟</span></span>
            </button>
          </div>
          <div class="stem-line">
            <span class="wx-chip">木</span>
            <button class="stem-tile yin" aria-pressed="false" data-title="乙木 · 垂柳" data-tag="阴木 · 缠绕" data-desc="持续减速，吸干墨浪水团加速状态。">
              <svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 12q13 4 27-6 M17 13q3 11-6 21 M23 12q6 9 0 19 M29 10q7 5 5 13"/></svg>
              <span><span class="stem-name">乙木</span><span class="stem-tag">垂柳</span></span>
            </button>
            <button class="stem-tile yang" aria-pressed="false" data-title="甲木 · 劲竹" data-tag="阳木 · 突刺" data-desc="破土连击；邻火激活「木生火」助燃增伤。">
              <svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 37 22 8m-6 19 5 1m-4-11 6 1 M20 21q5-8 14-9-4 7-14 9Z"/></svg>
              <span><span class="stem-name">甲木</span><span class="stem-tag">劲竹</span></span>
            </button>
          </div>
          <div class="stem-line">
            <span class="wx-chip">水</span>
            <button class="stem-tile yin" aria-pressed="false" data-title="癸水 · 涟漪" data-tag="阴水 · 浸湿" data-desc="群体易伤；水克火，直接浇熄爆裂灯笼怪。">
              <svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 6q-5 7-4 10a5 5 0 0 0 9-2q-1-3-5-8Z M15 23c-9 3 8 7 14 2 M9 27c-10 6 18 11 26 2"/></svg>
              <span><span class="stem-name">癸水</span><span class="stem-tag">涟漪</span></span>
            </button>
            <button class="stem-tile yang" aria-pressed="false" data-title="壬水 · 潮头" data-tag="阳水 · 推回" data-desc="巨浪冲刷推回；邻木激活「水生木」扩大控场。">
              <svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 32q9 1 13-12 4-13 16-10-9 0-8 8 1 7 10 4-5 8-14 4"/></svg>
              <span><span class="stem-name">壬水</span><span class="stem-tag">潮头</span></span>
            </button>
          </div>
          <div class="stem-line">
            <span class="wx-chip">火</span>
            <button class="stem-tile yin" aria-pressed="false" data-title="丁火 · 灯焰" data-tag="阴火 · 融甲" data-desc="精准灼烧；火克金，熔软锈甲铜偶重甲。">
              <svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 25q12 3 24-2-2 9-12 10-9-1-12-8Z M21 24c-8-5 3-10 2-17 7 6 4 11 1 14"/></svg>
              <span><span class="stem-name">丁火</span><span class="stem-tag">灯焰</span></span>
            </button>
            <button class="stem-tile yang" aria-pressed="false" data-title="丙火 · 日轮" data-tag="阳火 · 引爆" data-desc="大范围烈焰；邻土激活「火生土」灼烧地面。">
              <svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 25a10 10 0 1 1 20 0 M22 4v4M8 11l3 3m25-3-3 3 M5 21h4m26 0h4"/></svg>
              <span><span class="stem-name">丙火</span><span class="stem-tag">日轮</span></span>
            </button>
          </div>
          <div class="stem-line">
            <span class="wx-chip">土</span>
            <button class="stem-tile yin" aria-pressed="false" data-title="己土 · 梯田" data-tag="阴土 · 截流" data-desc="层叠减速地形；土克水，截停墨浪水团。">
              <svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 26q6-5 12-5t10-5q4-4 10-3 M5 31q9-6 16-5 6 0 10-5l6-2"/></svg>
              <span><span class="stem-name">己土</span><span class="stem-tag">梯田</span></span>
            </button>
            <button class="stem-tile yang" aria-pressed="false" data-title="戊土 · 叠嶂" data-tag="阳土 · 阻障" data-desc="山障拦截节奏；阴阳同守可积攒太极调和波。">
              <svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 32 15 18l4 5L27 8l14 24 M18 32l7-11"/></svg>
              <span><span class="stem-name">戊土</span><span class="stem-tag">叠嶂</span></span>
            </button>
          </div>
        </div>
      </div>

      <div data-panel="enemies" hidden>
        <div class="tile-grid-2" id="wuxingEnemies">
          <button class="visual-tile" aria-pressed="true" data-title="锈甲铜偶" data-tag="金 · 畏火" data-desc="重甲缓行，被丁火/丙火灼烧后护甲骤降。">
            <span class="art-icon amber"><strong style="font-size:18px">金</strong></span>
            <span><span class="tile-name">锈甲铜偶</span><span class="tile-pill">火克金</span></span>
          </button>
          <button class="visual-tile" aria-pressed="false" data-title="缠藤竹灵" data-tag="木 · 畏金" data-desc="周围群疗，被辛金/庚金斩藤打断回复。">
            <span class="art-icon green"><strong style="font-size:18px">木</strong></span>
            <span><span class="tile-name">缠藤竹灵</span><span class="tile-pill">金克木</span></span>
          </button>
          <button class="visual-tile" aria-pressed="false" data-title="墨浪水团" data-tag="水 · 畏土" data-desc="沿水脉疾滑，遇梯田叠嶂截流减速。">
            <span class="art-icon blue"><strong style="font-size:18px">水</strong></span>
            <span><span class="tile-name">墨浪水团</span><span class="tile-pill">土克水</span></span>
          </button>
          <button class="visual-tile" aria-pressed="false" data-title="爆裂灯笼怪" data-tag="火 · 畏水" data-desc="易爆突进，被癸水/壬水淋湿直接熄火。">
            <span class="art-icon coral"><strong style="font-size:18px">火</strong></span>
            <span><span class="tile-name">爆裂灯笼怪</span><span class="tile-pill">水克火</span></span>
          </button>
          <button class="visual-tile full" aria-pressed="false" data-title="失衡太极炉 · BOSS" data-tag="阴阳翻转" data-desc="切换阴/阳态并蓄力五行，残血双脉同时涌怪。">
            <span class="art-icon coral"><strong style="font-size:18px">炉</strong></span>
            <span><span class="tile-name">失衡太极炉（最终 BOSS）</span><span class="tile-pill">双脉解体</span></span>
          </button>
        </div>
      </div>

      <div data-panel="cycle" hidden>
        <div class="formula-list">
          <div class="formula-card"><span class="f-icon">木</span><span class="f-op">→</span><span class="f-icon">火</span><span class="f-op">·</span><span class="f-out">助燃扩大范围</span></div>
          <div class="formula-card"><span class="f-icon">火</span><span class="f-op">→</span><span class="f-icon">土</span><span class="f-op">·</span><span class="f-out">烤炙灼烧地面</span></div>
          <div class="formula-card"><span class="f-icon">土</span><span class="f-op">→</span><span class="f-icon">金</span><span class="f-op">·</span><span class="f-out">强化破甲击退</span></div>
          <div class="formula-card"><span class="f-icon">金</span><span class="f-op">→</span><span class="f-icon">水</span><span class="f-op">→</span><span class="f-out">激浪滋养竹柳</span></div>
        </div>
      </div>

      <div class="inspector">
        <div class="inspector-box" id="inspector">
          <div class="inspector-top">
            <span class="inspector-title">辛金 · 银簪</span>
            <span class="inspector-tag">阴金 · 破甲</span>
          </div>
          <p class="inspector-desc">精准破甲点杀；金克木，斩断缠藤竹灵回血。</p>
        </div>
        <div class="deck-foot">
          <button class="btn-game vermilion" id="guardBtn">守护阴阳五行（筹备中）</button>
        </div>
      </div>
    </section>
  </main>
</div>

<dialog id="guardDialog" aria-labelledby="guardTitle">
  <div class="modal-head">
    <h2 id="guardTitle">第二章筹备中</h2>
    <button class="modal-x" data-close aria-label="关闭">✕</button>
  </div>
  <div class="modal-body">
    <p>「阴阳五行」黑白双水脉实机关卡正在开发中，敬请期待。</p>
    <div class="modal-foot"><button class="btn-game ghost" data-close>知道了</button></div>
  </div>
</dialog>

<script>
const byId = id => document.getElementById(id);
try {
  const b = localStorage.getItem('atlas.brightness');
  if (b) document.documentElement.style.filter = `brightness(${b}%)`;
} catch {}

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const dlg = byId('guardDialog');
byId('guardBtn').onclick = () => dlg.showModal();
dlg.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => dlg.close()));
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

document.querySelectorAll('.tab-pill').forEach(tab => {
  tab.addEventListener('click', () => {
    const name = tab.dataset.tab;
    document.querySelectorAll('.tab-pill').forEach(b => b.setAttribute('aria-selected', String(b === tab)));
    document.querySelectorAll('[data-panel]').forEach(p => { p.hidden = p.dataset.panel !== name; });
    const active = document.querySelector(`[data-panel="${name}"]`);
    const picked = active.querySelector('[aria-pressed="true"]') || active.querySelector('[data-title]');
    if (picked) updateInspector(picked);
  });
});

function updateInspector(el) {
  const box = byId('inspector');
  box.querySelector('.inspector-title').textContent = el.dataset.title;
  box.querySelector('.inspector-tag').textContent = el.dataset.tag;
  box.querySelector('.inspector-desc').textContent = el.dataset.desc;
}

['wuxingStems', 'wuxingEnemies'].forEach(id => {
  const wrap = byId(id);
  wrap.addEventListener('click', e => {
    const btn = e.target.closest('button[data-title]');
    if (!btn) return;
    wrap.querySelectorAll('button[data-title]').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    updateInspector(btn);
  });
});

function drawWuxing(ts) {
  const c = byId('wxMiniCanvas');
  const w = c.clientWidth || 520, h = c.clientHeight || 340;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  }
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const t = ts / 1000;

  ctx.fillStyle = '#f3ecdc'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#c94a34'; ctx.strokeStyle = '#1b222c'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(w * 0.84, h * 0.2, 24, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  const mt = (p1, p2, p3, col) => {
    ctx.fillStyle = col; ctx.strokeStyle = '#1b222c'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.lineTo(p3[0], p3[1]); ctx.closePath(); ctx.fill(); ctx.stroke();
  };
  mt([w * 0.02, h * 0.72], [w * 0.22, h * 0.22], [w * 0.44, h * 0.72], '#287a6b');
  mt([w * 0.28, h * 0.74], [w * 0.5, h * 0.28], [w * 0.74, h * 0.74], '#4aa08e');
  mt([w * 0.58, h * 0.72], [w * 0.78, h * 0.34], [w * 0.98, h * 0.72], '#287a6b');

  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(w * 0.04, h * 0.82); ctx.quadraticCurveTo(w * 0.26, h * 0.58, w * 0.5, h * 0.78);
  ctx.strokeStyle = '#243038'; ctx.lineWidth = 24; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(w * 0.96, h * 0.82); ctx.quadraticCurveTo(w * 0.74, h * 0.58, w * 0.5, h * 0.78);
  ctx.strokeStyle = '#1b222c'; ctx.lineWidth = 26; ctx.stroke();
  ctx.strokeStyle = '#fffdf8'; ctx.lineWidth = 20; ctx.stroke();

  ctx.save(); ctx.setLineDash([8, 14]); ctx.lineDashOffset = -t * 28;
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(w * 0.04, h * 0.82); ctx.quadraticCurveTo(w * 0.26, h * 0.58, w * 0.5, h * 0.78); ctx.stroke();
  ctx.strokeStyle = 'rgba(27,34,44,0.28)';
  ctx.beginPath(); ctx.moveTo(w * 0.96, h * 0.82); ctx.quadraticCurveTo(w * 0.74, h * 0.58, w * 0.5, h * 0.78); ctx.stroke();
  ctx.restore();

  ctx.save(); ctx.translate(w * 0.5, h * 0.78); ctx.rotate(t * 0.7);
  ctx.fillStyle = '#243038'; ctx.strokeStyle = '#1b222c'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fffdf8'; ctx.beginPath(); ctx.arc(0, 0, 21, -Math.PI / 2, Math.PI / 2); ctx.fill();
  ctx.fillStyle = '#243038'; ctx.beginPath(); ctx.arc(0, -10.5, 10.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fffdf8'; ctx.beginPath(); ctx.arc(0, 10.5, 10.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fffdf8'; ctx.beginPath(); ctx.arc(0, -10.5, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#243038'; ctx.beginPath(); ctx.arc(0, 10.5, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  const passes = [
    { x: w * 0.18, y: h * 0.62, col: '#f4d06f' },
    { x: w * 0.34, y: h * 0.48, col: '#77c9a8' },
    { x: w * 0.5, y: h * 0.43, col: '#7ec4e8' },
    { x: w * 0.66, y: h * 0.48, col: '#eb7157' },
    { x: w * 0.82, y: h * 0.62, col: '#e3b266' }
  ];
  ctx.save(); ctx.strokeStyle = 'rgba(201, 74, 52, 0.55)'; ctx.lineWidth = 2.5;
  ctx.setLineDash([6, 6]); ctx.lineDashOffset = -t * 24;
  ctx.beginPath(); passes.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); ctx.restore();

  for (const p of passes) {
    ctx.fillStyle = p.col; ctx.strokeStyle = '#1b222c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(p.x - 11, p.y - 6, 22, 16, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#c94a34';
    ctx.beginPath(); ctx.moveTo(p.x - 15, p.y - 5); ctx.lineTo(p.x, p.y - 16); ctx.lineTo(p.x + 15, p.y - 5); ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  const u = (t * 0.18) % 1;
  const lx = (1 - u) * (1 - u) * (w * 0.94) + 2 * (1 - u) * u * (w * 0.74) + u * u * (w * 0.52);
  const ly = (1 - u) * (1 - u) * (h * 0.81) + 2 * (1 - u) * u * (h * 0.58) + u * u * (h * 0.77) - Math.sin(t * 8) * 3;
  ctx.fillStyle = '#e85a3c'; ctx.strokeStyle = '#1b222c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(lx, ly - 8, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  if (!reducedMotion.matches) requestAnimationFrame(drawWuxing);
}
requestAnimationFrame(drawWuxing);
</script>
</body>
</html>
