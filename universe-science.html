<script>
const byId = id => document.getElementById(id);
try {
  const b = localStorage.getItem('atlas.brightness');
  if (b) document.documentElement.style.filter = `brightness(${b}%)`;
} catch {}

let focusKey = 'physics';
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

document.querySelectorAll('.tab-pill').forEach(tab => {
  tab.addEventListener('click', () => {
    const name = tab.dataset.tab;
    document.querySelectorAll('.tab-pill').forEach(b => b.setAttribute('aria-selected', String(b === tab)));
    document.querySelectorAll('[data-panel]').forEach(p => { p.hidden = p.dataset.panel !== name; });
    const active = document.querySelector(`[data-panel="${name}"]`);
    const picked = active.querySelector('[aria-pressed="true"]') || active.querySelector('[data-title]');
    if (picked) updateInspector(picked);
  });
});

function updateInspector(el) {
  const box = byId('inspector');
  box.querySelector('.inspector-title').textContent = el.dataset.title;
  box.querySelector('.inspector-tag').textContent = el.dataset.tag;
  box.querySelector('.inspector-desc').textContent = el.dataset.desc;
  if (el.dataset.focus) focusKey = el.dataset.focus;
}

['scienceTowers', 'scienceEnemies'].forEach(id => {
  const wrap = byId(id);
  wrap.addEventListener('click', e => {
    const btn = e.target.closest('button[data-title]');
    if (!btn) return;
    wrap.querySelectorAll('button[data-title]').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    updateInspector(btn);
  });
});

function samplePath(pts, u) {
  const segs = [];
  let total = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const len = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
    segs.push({ a: pts[i], b: pts[i + 1], len });
    total += len;
  }
  let target = ((u % 1) + 1) % 1 * total;
  for (const s of segs) {
    if (target <= s.len) {
      const k = s.len ? target / s.len : 0;
      return [s.a[0] + (s.b[0] - s.a[0]) * k, s.a[1] + (s.b[1] - s.a[1]) * k];
    }
    target -= s.len;
  }
  return pts[pts.length - 1];
}

function drawLab(ts) {
  const c = byId('labMiniCanvas');
  const w = c.clientWidth || 520, h = c.clientHeight || 340;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  }
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const t = ts / 1000;

  const bg = ctx.createRadialGradient(w * 0.78, h * 0.72, 20, w * 0.5, h * 0.5, w * 0.85);
  bg.addColorStop(0, '#1f3b40');
  bg.addColorStop(1, '#111d24');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = 'rgba(130, 195, 190, 0.1)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 10; i++) { ctx.beginPath(); ctx.moveTo((w / 10) * i, 0); ctx.lineTo((w / 10) * i, h); ctx.stroke(); }
  for (let j = 1; j < 7; j++) { ctx.beginPath(); ctx.moveTo(0, (h / 7) * j); ctx.lineTo(w, (h / 7) * j); ctx.stroke(); }

  const pts = [[w * 0.1, h * 0.25], [w * 0.44, h * 0.25], [w * 0.44, h * 0.74], [w * 0.86, h * 0.74]];
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1] + 9) : ctx.moveTo(p[0], p[1] + 9));
  ctx.strokeStyle = '#091015'; ctx.lineWidth = 38; ctx.stroke();

  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.strokeStyle = '#1b222c'; ctx.lineWidth = 36; ctx.stroke();
  ctx.strokeStyle = '#2a3942'; ctx.lineWidth = 28; ctx.stroke();

  ctx.save();
  ctx.setLineDash([8, 12]); ctx.lineDashOffset = -t * 36;
  ctx.strokeStyle = 'rgba(134, 215, 206, 0.35)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.restore();

  const [rx, ry] = pts[0];
  const rGlow = ctx.createRadialGradient(rx, ry, 4, rx, ry, 34);
  rGlow.addColorStop(0, 'rgba(116, 224, 128, 0.75)'); rGlow.addColorStop(1, 'rgba(116, 224, 128, 0)');
  ctx.fillStyle = rGlow; ctx.beginPath(); ctx.arc(rx, ry, 34, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#8ef08b'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(rx, ry, 14, 22, 0, 0, Math.PI * 2); ctx.stroke();

  const [cx, cy] = pts[3];
  const cGlow = ctx.createRadialGradient(cx, cy, 4, cx, cy, 44 + Math.sin(t * 4) * 5);
  cGlow.addColorStop(0, 'rgba(255, 190, 74, 0.72)'); cGlow.addColorStop(1, 'rgba(255, 140, 40, 0)');
  ctx.fillStyle = cGlow; ctx.beginPath(); ctx.arc(cx, cy, 48, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#253138'; ctx.strokeStyle = '#f4b731'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.roundRect(cx - 22, cy - 22, 44, 44, 10); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 1.8); ctx.strokeStyle = '#ffcf66'; ctx.lineWidth = 2.5;
  for (let k = 0; k < 4; k++) { ctx.rotate(Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -12); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = '#fff3cf'; ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();

  const slimePos = samplePath(pts, (t * 0.12) % 1);
  const ironPos = samplePath(pts, (t * 0.08 + 0.34) % 1);
  const bubblePos = samplePath(pts, (t * 0.16 + 0.62) % 1);
  const mushPos = samplePath(pts, (t * 0.09 + 0.18) % 1);

  const tPhys = [w * 0.27, h * 0.49], tChem = [w * 0.63, h * 0.48], tBio = [w * 0.27, h * 0.78], tComp = [w * 0.66, h * 0.2];
  const ring = (x, y, key, col) => {
    if (focusKey !== key) return;
    ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.arc(x, y, 27 + Math.sin(t * 6) * 3, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  };

  ring(tPhys[0], tPhys[1], 'physics', '#72e2f2');
  ctx.fillStyle = '#1b2730'; ctx.strokeStyle = '#72e2f2'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(tPhys[0], tPhys[1] + 10, 18, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#dce6ea'; ctx.strokeStyle = '#1b222c';
  ctx.fillRect(tPhys[0] - 7, tPhys[1] - 12, 14, 22); ctx.strokeRect(tPhys[0] - 7, tPhys[1] - 12, 14, 22);
  ctx.fillStyle = '#f4b731'; ctx.beginPath(); ctx.ellipse(tPhys[0], tPhys[1] - 6, 13, 4.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#72e2f2'; ctx.beginPath(); ctx.arc(tPhys[0], tPhys[1] - 18, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  ring(tChem[0], tChem[1], 'chemistry', '#ff9f4d');
  ctx.fillStyle = '#1b2730'; ctx.strokeStyle = '#ff9f4d'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(tChem[0], tChem[1] + 10, 18, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f4e6cf'; ctx.strokeStyle = '#1b222c';
  ctx.beginPath(); ctx.moveTo(tChem[0] - 12, tChem[1] + 8); ctx.lineTo(tChem[0] - 6, tChem[1] - 12); ctx.lineTo(tChem[0] + 6, tChem[1] - 12); ctx.lineTo(tChem[0] + 12, tChem[1] + 8); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f4783b'; ctx.beginPath(); ctx.moveTo(tChem[0] - 7, tChem[1] - 12); ctx.quadraticCurveTo(tChem[0], tChem[1] - 28 - Math.sin(t * 9) * 3, tChem[0] + 7, tChem[1] - 12); ctx.fill();

  ring(tBio[0], tBio[1], 'biology', '#7de075');
  ctx.fillStyle = '#1b2730'; ctx.strokeStyle = '#7de075'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(tBio[0], tBio[1] + 10, 18, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#9c714a'; ctx.fillRect(tBio[0] - 4, tBio[1] - 6, 8, 16);
  ctx.fillStyle = '#6fd15c'; ctx.strokeStyle = '#1b222c';
  ctx.beginPath(); ctx.arc(tBio[0] - 8, tBio[1] - 8, 8, 0, Math.PI * 2); ctx.arc(tBio[0] + 8, tBio[1] - 8, 8, 0, Math.PI * 2); ctx.arc(tBio[0], tBio[1] - 15, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  ring(tComp[0], tComp[1], 'compute', '#f4d06f');
  ctx.fillStyle = '#1b2730'; ctx.strokeStyle = '#f4d06f'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(tComp[0], tComp[1] + 10, 18, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.translate(tComp[0], tComp[1] - 8); ctx.rotate(t * 1.4);
  ctx.fillStyle = '#f4b731'; ctx.strokeStyle = '#1b222c'; ctx.fillRect(-9, -9, 18, 18); ctx.strokeRect(-9, -9, 18, 18); ctx.restore();

  if (Math.hypot(ironPos[0] - tPhys[0], ironPos[1] - tPhys[1]) < w * 0.34) {
    ctx.strokeStyle = '#8ef0ff'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(tPhys[0], tPhys[1] - 18);
    ctx.lineTo((tPhys[0] + ironPos[0]) * 0.5 + Math.sin(t * 45) * 6, (tPhys[1] + ironPos[1]) * 0.5 + Math.cos(t * 40) * 6);
    ctx.lineTo(ironPos[0], ironPos[1]); ctx.stroke();
  }
  if (Math.hypot(bubblePos[0] - tChem[0], bubblePos[1] - tChem[1]) < w * 0.32) {
    ctx.strokeStyle = '#ff9843'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(tChem[0], tChem[1] - 16); ctx.lineTo(bubblePos[0], bubblePos[1]); ctx.stroke();
    const pr = ((t * 2.2) % 1) * 26;
    ctx.strokeStyle = `rgba(255, 160, 74, ${1 - pr / 26})`;
    ctx.beginPath(); ctx.arc(bubblePos[0], bubblePos[1], 8 + pr, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.save(); ctx.strokeStyle = 'rgba(244, 208, 111, 0.5)'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(tComp[0], tComp[1] - 8); ctx.lineTo(mushPos[0], mushPos[1]); ctx.stroke(); ctx.restore();

  ring(mushPos[0], mushPos[1], 'mushroom', '#f4d06f');
  ctx.strokeStyle = 'rgba(140, 224, 121, 0.45)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(mushPos[0], mushPos[1], 22 + Math.sin(t * 4) * 2, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#fffdf8'; ctx.fillRect(mushPos[0] - 4, mushPos[1] - 2, 8, 9);
  ctx.fillStyle = '#c9795b'; ctx.strokeStyle = '#1b222c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(mushPos[0], mushPos[1] - 2, 11, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();

  ring(slimePos[0], slimePos[1], 'slime', '#7de075');
  const sb = Math.abs(Math.sin(t * 6)) * 4;
  ctx.fillStyle = '#6fd15c'; ctx.strokeStyle = '#1b222c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(slimePos[0], slimePos[1] - sb, 11, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1b222c';
  ctx.beginPath(); ctx.arc(slimePos[0] - 3.5, slimePos[1] - sb - 4, 1.5, 0, Math.PI * 2); ctx.arc(slimePos[0] + 3.5, slimePos[1] - sb - 4, 1.5, 0, Math.PI * 2); ctx.fill();

  ring(ironPos[0], ironPos[1], 'ironball', '#9bb4d4');
  ctx.fillStyle = '#6a7687'; ctx.strokeStyle = '#1b222c'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.arc(ironPos[0], ironPos[1], 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#dce6f2'; ctx.beginPath(); ctx.arc(ironPos[0] - 4, ironPos[1] - 4, 3, 0, Math.PI * 2); ctx.fill();

  ring(bubblePos[0], bubblePos[1], 'bubble', '#ff9843');
  ctx.fillStyle = '#f9825c'; ctx.strokeStyle = '#1b222c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(bubblePos[0], bubblePos[1], 10 + Math.sin(t * 10) * 1.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fffdf8'; ctx.beginPath(); ctx.arc(bubblePos[0] - 3, bubblePos[1] - 3, 2.8, 0, Math.PI * 2); ctx.fill();

  if (!reducedMotion.matches) requestAnimationFrame(drawLab);
}
requestAnimationFrame(drawLab);
