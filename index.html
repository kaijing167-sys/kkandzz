<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星界守望 · 多元宇宙塔防</title>
<link rel="stylesheet" href="theme.css">
<style>
.hero {
  display: grid;
  grid-template-columns: minmax(280px, 420px) 1fr;
  gap: clamp(18px, 4vw, 40px);
  align-items: center;
  margin-bottom: 28px;
}

.badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

.hero-logo {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(3rem, 6.4vw, 4.8rem);
  line-height: 1.04;
  letter-spacing: 0.06em;
  color: var(--lab-amber);
  -webkit-text-stroke: 2.5px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 6px 0 var(--ink);
}

.hero-sub { margin: 10px 0 18px; font-size: 16.5px; font-weight: 800; color: var(--ink-soft); letter-spacing: 0.06em; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; }

.diorama-frame {
  background: #e6f1ec;
  border: 3px solid var(--ink);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  aspect-ratio: 16 / 9.6;
}
.diorama-frame svg { width: 100%; height: 100%; display: block; }
.float-slow { animation: floatY 3.5s ease-in-out infinite; }
.float-alt { animation: floatY 4.1s ease-in-out -1.5s infinite; }
@keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

.section-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.section-label h2 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 1.45rem; }
.section-label span { font-size: 12.5px; font-weight: 700; color: var(--ink-mute); }

.world-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }

.world-card {
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 3px solid var(--ink);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  transition: transform 0.14s, box-shadow 0.14s;
}
.world-card:hover { transform: translateY(-3px); box-shadow: 0 8px 0 var(--ink); }
.world-card.locked { background: #f1ece1; opacity: 0.84; cursor: default; }
.world-card.locked:hover { transform: none; box-shadow: var(--shadow-md); }

.world-banner { position: relative; aspect-ratio: 16 / 9; border-bottom: 3px solid var(--ink); overflow: hidden; }
.world-banner svg { width: 100%; height: 100%; display: block; }
.world-num {
  position: absolute; top: 10px; left: 10px;
  padding: 2px 9px; border: 2px solid var(--ink); border-radius: 8px;
  background: var(--card); font-weight: 800; font-size: 11.5px;
}

.world-body { padding: 14px; display: flex; flex-direction: column; flex: 1; }
.world-body h3 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 900; font-size: 1.4rem; }

.pill-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.mini-pill { padding: 3px 8px; border: 1.8px solid var(--ink); border-radius: 7px; font-size: 11.5px; font-weight: 700; background: var(--card-alt); }
.mini-pill.teal { background: var(--lab-teal-soft); }
.mini-pill.red { background: var(--wx-vermilion-soft); }

.world-go { margin-top: auto; display: flex; justify-content: space-between; padding-top: 9px; border-top: 2px dashed #d6cebe; font-weight: 800; font-size: 13px; }

@media (max-width: 900px) {
  .hero, .world-cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="page-shell">
  <!-- 主页面顶栏 -->
  <header class="topbar">
    <div class="nav-left">
      <a class="pill-btn" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none" stroke="#1b222c" stroke-width="2.2" stroke-linecap="round"><circle cx="10" cy="10" r="3.2"/><path d="M10 2v3M10 15v3M2 10h3M15 10h3"/></svg>
        </span>
        <span>星界守望</span>
      </a>
    </div>
    <button class="pill-btn" id="settingsBtn">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h14M3 14h14"/><circle cx="7" cy="6" r="2.2" fill="#fffdf8"/><circle cx="13" cy="14" r="2.2" fill="#fffdf8"/></svg>
      <span>设置</span>
    </button>
  </header>

  <!-- 主封面区 -->
  <section class="hero">
    <div>
      <h1 class="hero-logo">星界守望</h1>
      <p class="hero-sub">多元宇宙塔防 · 科学反应与五行生克</p>
      <div class="hero-cta">
        <a class="btn-game teal" href="science-era.html">开始试玩</a>
        <a class="btn-game ghost" href="#worlds">选择宇宙</a>
      </div>
    </div>

    <div class="diorama-frame" aria-hidden="true">
      <svg viewBox="0 0 640 384" fill="none">
        <rect width="640" height="384" fill="#e6f1ec"/>
        <circle cx="536" cy="76" r="34" fill="#f4b731" stroke="#1b222c" stroke-width="3"/>
        <g fill="#fffdf8" stroke="#1b222c" stroke-width="2.5">
          <rect x="56" y="48" width="90" height="26" rx="13"/>
          <rect x="282" y="36" width="72" height="22" rx="11"/>
        </g>
        <path d="M190 202 C 260 98, 380 98, 450 198" stroke="#1b222c" stroke-width="3" stroke-dasharray="9 8" stroke-linecap="round"/>
        <circle cx="320" cy="122" r="13" fill="#f4b731" stroke="#1b222c" stroke-width="3"/>
        <path d="M314 122h12M320 116v12" stroke="#1b222c" stroke-width="2.5" stroke-linecap="round"/>

        <!-- 科学纪元浮岛 -->
        <g class="float-slow">
          <polygon points="56,252 186,196 306,252 186,310" fill="#9cd3c4" stroke="#1b222c" stroke-width="3" stroke-linejoin="round"/>
          <polygon points="56,252 186,310 186,336 56,278" fill="#1d8a78" stroke="#1b222c" stroke-width="3" stroke-linejoin="round"/>
          <polygon points="306,252 186,310 186,336 306,278" fill="#146457" stroke="#1b222c" stroke-width="3" stroke-linejoin="round"/>
          <path d="M106 254 L182 222 L252 254" stroke="#fffdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="164" y="176" width="36" height="46" rx="8" fill="#fffdf8" stroke="#1b222c" stroke-width="3"/>
          <ellipse cx="182" cy="176" rx="22" ry="8" fill="#f4b731" stroke="#1b222c" stroke-width="3"/>
          <circle cx="182" cy="156" r="11" fill="#e8624a" stroke="#1b222c" stroke-width="3"/>
          <path d="M126 258 C126 240, 154 240, 154 258 Z" fill="#6fd15c" stroke="#1b222c" stroke-width="2.5"/>
        </g>

        <!-- 阴阳五行浮岛 -->
        <g class="float-alt">
          <polygon points="340,244 466,188 590,244 466,302" fill="#efe4cd" stroke="#1b222c" stroke-width="3" stroke-linejoin="round"/>
          <polygon points="340,244 466,302 466,328 340,270" fill="#c94a34" stroke="#1b222c" stroke-width="3" stroke-linejoin="round"/>
          <polygon points="590,244 466,302 466,328 590,270" fill="#8f3121" stroke="#1b222c" stroke-width="3" stroke-linejoin="round"/>
          <path d="M388 244 Q432 226 466 246" stroke="#243038" stroke-width="10" stroke-linecap="round"/>
          <path d="M542 244 Q498 226 466 246" stroke="#fffdf8" stroke-width="10" stroke-linecap="round"/>
          <polygon points="410,228 446,172 482,228" fill="#287a6b" stroke="#1b222c" stroke-width="3" stroke-linejoin="round"/>
          <rect x="466" y="198" width="38" height="28" fill="#fffdf8" stroke="#1b222c" stroke-width="3"/>
          <polygon points="456,200 485,178 514,200" fill="#c94a34" stroke="#1b222c" stroke-width="3" stroke-linejoin="round"/>
        </g>
      </svg>
    </div>
  </section>

  <!-- 平行宇宙入口卡带（独立子页面导航） -->
  <section id="worlds">
    <div class="section-label">
      <h2>平行宇宙</h2>
    </div>

    <div class="world-cards">
      <a class="world-card" href="universe-science.html">
        <div class="world-banner" style="background:#dff2ec">
          <span class="world-num">Ⅰ</span>
          <svg viewBox="0 0 360 202" fill="none">
            <rect width="360" height="202" fill="#dff2ec"/>
            <path d="M0 148 Q90 116 180 144 T360 136 L360 202 L0 202 Z" fill="#9cd3c4" stroke="#1b222c" stroke-width="3"/>
            <rect x="138" y="60" width="44" height="76" rx="10" fill="#fffdf8" stroke="#1b222c" stroke-width="3"/>
            <ellipse cx="160" cy="64" rx="28" ry="9" fill="#f4b731" stroke="#1b222c" stroke-width="3"/>
            <circle cx="160" cy="42" r="12" fill="#e8624a" stroke="#1b222c" stroke-width="3"/>
            <path d="M236 94h28l12 40a8 8 0 0 1-8 10h-36a8 8 0 0 1-8-10z" fill="#fffdf8" stroke="#1b222c" stroke-width="3"/>
            <path d="M230 124h40l6 12a6 6 0 0 1-6 8h-40a6 6 0 0 1-6-8z" fill="#6fd15c" stroke="#1b222c" stroke-width="2.5"/>
            <circle cx="84" cy="134" r="18" fill="#697585" stroke="#1b222c" stroke-width="3"/>
          </svg>
        </div>
        <div class="world-body">
          <h3>科学纪元</h3>
          <div class="pill-list">
            <span class="mini-pill teal">四大学科塔</span>
            <span class="mini-pill">可玩关卡</span>
          </div>
          <div class="world-go"><span>查看图鉴</span><span>→</span></div>
        </div>
      </a>

      <a class="world-card" href="universe-wuxing.html">
        <div class="world-banner" style="background:#f7efe0">
          <span class="world-num">Ⅱ</span>
          <svg viewBox="0 0 360 202" fill="none">
            <rect width="360" height="202" fill="#f7efe0"/>
            <circle cx="286" cy="50" r="22" fill="#c94a34" stroke="#1b222c" stroke-width="3"/>
            <polygon points="24,174 112,68 200,174" fill="#287a6b" stroke="#1b222c" stroke-width="3" stroke-linejoin="round"/>
            <polygon points="150,174 232,92 320,174" fill="#4aa08e" stroke="#1b222c" stroke-width="3" stroke-linejoin="round"/>
            <path d="M0 160 Q110 128 180 166" stroke="#243038" stroke-width="15" stroke-linecap="round"/>
            <path d="M360 160 Q250 128 180 166" stroke="#fffdf8" stroke-width="15" stroke-linecap="round"/>
            <rect x="160" y="110" width="40" height="28" fill="#fffdf8" stroke="#1b222c" stroke-width="3"/>
            <polygon points="148,112 180,88 212,112" fill="#c94a34" stroke="#1b222c" stroke-width="3" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="world-body">
          <h3>阴阳五行</h3>
          <div class="pill-list">
            <span class="mini-pill red">十天干阴阳塔</span>
            <span class="mini-pill">黑白双水脉</span>
          </div>
          <div class="world-go"><span>查看图鉴</span><span>→</span></div>
        </div>
      </a>

      <div class="world-card locked" aria-disabled="true">
        <div class="world-banner" style="background:#ebe4d6">
          <span class="world-num">Ⅲ</span>
          <svg viewBox="0 0 360 202" fill="none">
            <rect width="360" height="202" fill="#ebe4d6"/>
            <circle cx="180" cy="101" r="50" fill="#fffdf8" stroke="#1b222c" stroke-width="3" stroke-dasharray="10 7"/>
            <circle cx="180" cy="101" r="22" fill="#f4b731" stroke="#1b222c" stroke-width="3"/>
          </svg>
        </div>
        <div class="world-body">
          <h3>敬请期待</h3>
          <div class="pill-list">
            <span class="mini-pill">星门未启</span>
          </div>
          <div class="world-go"><span>筹备中</span><span>···</span></div>
        </div>
      </div>
    </div>
  </section>
</div>

<dialog id="settingsDialog" aria-labelledby="settingsTitle">
  <div class="modal-head">
    <h2 id="settingsTitle">全局设置</h2>
    <button class="modal-x" data-close aria-label="关闭">✕</button>
  </div>
  <div class="modal-body">
    <label class="slider-group">
      <span class="slider-top"><span>音效音量</span><output id="volOut">55%</output></span>
      <input type="range" id="volume" min="0" max="100" value="55">
    </label>
    <label class="slider-group">
      <span class="slider-top"><span>画面亮度</span><output id="lightOut">100%</output></span>
      <input type="range" id="brightness" min="60" max="115" value="100">
    </label>
    <div class="modal-foot"><button class="btn-game amber" data-close>完成</button></div>
  </div>
</dialog>

<script>
const byId = id => document.getElementById(id);
const dlg = byId('settingsDialog');
byId('settingsBtn').onclick = () => dlg.showModal();
dlg.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => dlg.close()));
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

for (const [id, outId, def] of [['volume', 'volOut', 55], ['brightness', 'lightOut', 100]]) {
  const input = byId(id);
  let val = def;
  try { val = localStorage.getItem('atlas.' + id) ?? def; } catch {}
  input.value = val;
  const apply = () => {
    byId(outId).textContent = input.value + '%';
    if (id === 'brightness') document.documentElement.style.filter = `brightness(${input.value}%)`;
  };
  apply();
  input.addEventListener('input', () => {
    apply();
    try { localStorage.setItem('atlas.' + id, input.value); } catch {}
  });
}
</script>
</body>
</html>
