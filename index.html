<script>
const byId = id => document.getElementById(id);
const sky = byId('starlight');
const skyContext = sky.getContext('2d');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const stars = Array.from({length:75}, () => ({
  x:Math.random(), y:Math.random(), phase:Math.random()*Math.PI*2, size:.6+Math.random()*1.1
}));
let skyFrame = 0;
function animateSky(time) {
  const w=sky.clientWidth, h=sky.clientHeight;
  const ratio=Math.min(devicePixelRatio || 1,2);
  if(sky.width!==Math.round(w*ratio) || sky.height!==Math.round(h*ratio)){
    sky.width=Math.round(w*ratio); sky.height=Math.round(h*ratio);
  }
  const ctx=skyContext, t=time/1000;
  ctx.setTransform(ratio,0,0,ratio,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#ffe6aa';
  for(const star of stars){
    ctx.globalAlpha=.36+.3*Math.sin(t*.75+star.phase);
    ctx.beginPath();
    ctx.arc(star.x*w+4*Math.sin(t*.13+star.phase),((star.y*h-t*(1+star.size))%h+h)%h,star.size,0,Math.PI*2);
    ctx.fill();
  }
  for(let i=0;i<3;i++){
    const u=(t*.047+i/3)%1;
    const x=w*(.13+.74*u), y=h*(.76-.11*Math.sin(u*Math.PI*2));
    const glow=ctx.createRadialGradient(x,y,0,x,y,9);
    glow.addColorStop(0,'#fff1c4');glow.addColorStop(.25,'#ffcf81ba');glow.addColorStop(1,'#ffce7900');
    ctx.fillStyle=glow;ctx.globalAlpha=Math.sin(Math.PI*u)*.9;ctx.fillRect(x-9,y-9,18,18);
  }
  ctx.globalAlpha=1;
  skyFrame=requestAnimationFrame(animateSky);
}
function updateSky(){
  cancelAnimationFrame(skyFrame);
  if(!skyContext) return;
  if(byId('cover').hidden || document.hidden || reducedMotion.matches){
    skyContext.clearRect(0,0,sky.width,sky.height);return;
  }
  skyFrame=requestAnimationFrame(animateSky);
}
document.addEventListener('visibilitychange',updateSky);
reducedMotion.addEventListener('change',updateSky);
updateSky();
const pages = [
  ['UNIVERSE INDEX', '平行宇宙目录', '选择一个宇宙，展开它的篇章。'],
  ['UNIVERSE Ⅰ', '科学纪元', '第一平行宇宙 · 高耸的感应塔捕捉星际电流，守护通往核心的最后一条航道。'],
  ['UNIVERSE Ⅱ', '阴阳五行', '第二平行宇宙 · 一黑一白两条水脉环山而过。金、木、水、火、土五座关隘沿岸而立，共守阵眼。'],
  ['NEXT UNIVERSE', '敬请期待', '下一座宇宙的星门尚未开启。']
];
let page = -1;
let audio;
function chime() {
  try {
    audio ??= new AudioContext();
    audio.resume().catch(() => {});
    const tone = audio.createOscillator(), gain = audio.createGain();
    tone.frequency.value = 392;
    gain.gain.setValueAtTime(Number(byId('volume').value) * .0009, audio.currentTime);
    gain.gain.linearRampToValueAtTime(0, audio.currentTime + .23);
    tone.connect(gain).connect(audio.destination);
    tone.start(); tone.stop(audio.currentTime + .24);
  } catch {}
}
// Keep the spread still. A diagonal fold travels from the lower corner
// across the old leaf; the narrow band along the fold is its curved underside.
let turning = false;
function curl(book, oldPage, forward) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const canvas = document.createElement('canvas');
  canvas.id = 'turnsheet';
  canvas.setAttribute('aria-hidden','true');
  oldPage.removeAttribute('id');
  oldPage.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
  oldPage.inert = true;
  oldPage.hidden = false;
  oldPage.setAttribute('aria-hidden','true');
  oldPage.classList.add('old-page');
  book.append(oldPage, canvas);
  const ctx = canvas.getContext('2d');
  if (!ctx) { canvas.remove(); oldPage.remove(); return; }
  const w = book.clientWidth, h = book.clientHeight;
  const ratio = Math.min(devicePixelRatio || 1, 2);
  canvas.width = w * ratio; canvas.height = h * ratio;
  ctx.scale(ratio,ratio);
  turning = true;
  const start = performance.now();
  function draw(now) {
    const t = Math.min(1,(now-start)/900);
    const progress = t*t*(3-2*t);
    ctx.clearRect(0,0,w,h);
    ctx.save();
    if (!forward) { ctx.translate(w,0); ctx.scale(-1,1); }
    const tilt = Math.min(w*.32,h*.38);
    const bottom = w + tilt - (w + 2*tilt)*progress;
    const top = bottom + tilt;
    const curlWidth = Math.sin(Math.PI*t)*Math.min(115,w*.21);
    const x = v => forward ? v : w-v;
    const edge = [];
    for(let step=0;step<=20;step++){
      const u=step/20;
      const bx=(1-u)*(1-u)*top+2*(1-u)*u*(top-tilt*.12)+u*u*bottom;
      const by=(2*(1-u)*u*.56+u*u)*h;
      edge.push(x(bx)+'px '+by+'px');
    }
    oldPage.style.clipPath='polygon('+[x(0)+'px 0',...edge,x(0)+'px '+h+'px'].join(',')+')';
    if(curlWidth>0){
      const shade=ctx.createLinearGradient(top-curlWidth,0,top+12,tilt/h*(curlWidth+12));
      shade.addColorStop(0,'#ac9774');shade.addColorStop(.38,'#fff6d9');shade.addColorStop(.76,'#e6d7b3');shade.addColorStop(1,'#8c785e');
      ctx.beginPath();ctx.moveTo(top,0);ctx.quadraticCurveTo(top-tilt*.12,h*.56,bottom,h);
      ctx.quadraticCurveTo(bottom-curlWidth*.9,h*.98,bottom-curlWidth,h*.91);
      ctx.bezierCurveTo(top-curlWidth*1.25,h*.55,top-curlWidth*.9,h*.06,top,0);

}
function show(index) {
  if (turning || index < -1 || index >= pages.length) return;
  const oldPage = byId('book').cloneNode(true);
  if(page === -1){oldPage.className='book binding';oldPage.textContent='星 界 守 望';}
  const forward = index > page;
  page = index; chime();
  const onCover = page === -1;
  byId('cover').hidden = !onCover;
  updateSky();
  for (const id of ['book','prev','next']) byId(id).hidden = onCover;
  byId('counter').textContent = onCover ? '宇宙图鉴 ／ 封面' : (page + 1) + ' ／ ' + pages.length;
  if (onCover) { byId('start').focus(); return; }
  ['eyebrow','heading','description'].forEach((id,i) => byId(id).textContent = pages[page][i]);
  byId('subjects').hidden = page !== 1;
  byId('elements').hidden = page !== 2;
  byId('entry').hidden = page !== 0;
  byId('secondEntry').hidden = page !== 0;
  const hasChapter = page === 1 || page === 2;
  byId('guard').parentElement.hidden = !hasChapter;
  byId('guard').textContent = hasChapter ? '守护' + pages[page][1] : '';
  byId('next').disabled = page === pages.length - 1;
  byId('prev').textContent = page === 0 ? '返回封面' : '上一页';
  const book = byId('book');
  book.className = ['book', 'book illustrated', 'book wuxing', 'book'][page];
  curl(book, oldPage, forward);
  byId('heading').focus({preventScroll:true});
}
byId('start').onclick = () => show(0);
byId('entry').onclick = () => show(1);
byId('secondEntry').onclick = () => show(2);
byId('prev').onclick = () => show(page - 1);
byId('next').onclick = () => show(page + 1);
byId('guard').onclick = () => {
  if (turning) return;
  byId('guardTitle').textContent = byId('guard').textContent;
  byId('guardDialog').showModal();
};
byId('gear').onclick = () => byId('settings').showModal();
for (const [id, output, initial] of [['volume','volText',55],['brightness','lightText',100]]) {
  const slider = byId(id);
  slider.value = initial;
  try { slider.value = localStorage.getItem('atlas.' + id) ?? initial; } catch {}
  function apply() {
    byId(output).textContent = slider.value + '%';
    if (id === 'brightness') document.documentElement.style.filter = 'brightness(' + slider.value + '%)';
  }
  apply();
  slider.oninput = () => { apply(); try { localStorage.setItem('atlas.' + id, slider.value); } catch {} };
}
byId('volume').onchange = chime;
