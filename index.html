<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星界守望 · 多元宇宙塔防</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1b20;color:#fff1ce;font:16px/1.6 "DM Sans","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #63d6ed;outline-offset:4px}main{position:relative;isolation:isolate;min-height:100svh;display:grid;align-items:center;padding:6rem clamp(1.5rem,8vw,9rem);background:linear-gradient(90deg,#06181edb,transparent 80%),url(science-era.png) 65% center/cover,#13353b;perspective:1400px}header,footer{position:absolute;left:5%;right:5%;display:flex;justify-content:space-between;align-items:center;z-index:3}header{top:1.2rem;border-bottom:1px solid #d8bf8459;padding-bottom:.7rem;letter-spacing:.18em}header button,.navbtn{background:#10282d;color:#f7e7bd;border:1px solid #9d997e;border-radius:4px;padding:.45rem 1rem}header button{font-size:1.5rem;line-height:1.3}small{letter-spacing:.21em;color:#f2ce87}h1,h2{font-family:"STSong","SimSun",serif;line-height:1.12}h1{font-size:clamp(3.6rem,8vw,8rem);margin:.2em 0;letter-spacing:.05em}h2{font-size:clamp(2.6rem,6vw,5rem);margin:.2em 0}.start{background:#f6d38d;color:#202c2b;padding:.85rem 2.8rem;border:1px solid #ffe6ac;border-radius:3px;font-weight:bold;margin-top:1rem}footer{bottom:1rem;font:13px monospace;letter-spacing:.15em}.book{position:relative;padding:clamp(1.5rem,5vw,5rem);border:3px double #998250;box-shadow:6px 6px #aaa08a,10px 10px #37372e,0 15px 60px #0008;background:linear-gradient(90deg,#a99570,#e7dab8 3%,#f3e8c9 47%,#d6c6a1 50%,#eddfbc 52%,#ede2c6);color:#253b38;min-height:55svh;display:grid;align-content:center}.book small{color:#665437}.entry{border:0;border-block:1px solid #96886b;background:transparent;color:inherit;text-align:left;padding:1rem 0;font-size:1.2rem}.illustrated{background:linear-gradient(90deg,#082129eb,transparent),url(science-era.png) center/cover;color:#fff1ce}.illustrated small{color:#ead29d}.forward{transform-origin:left;animation:turn .64s ease-out}.back{transform-origin:right;animation:reverseTurn .64s ease-out}@keyframes turn{from{transform:rotateY(-78deg);filter:brightness(.65)}}@keyframes reverseTurn{from{transform:rotateY(78deg);filter:brightness(.65)}}.navbtn:disabled{opacity:.4;cursor:default}dialog{background:#132e32;color:#f4e4c3;border:1px solid #bc9d67;width:min(90vw,360px);padding:1.7rem}dialog::backdrop{background:#07171dcc}dialog label{display:block;margin:1rem 0}input{width:100%;accent-color:#efc77c}output{float:right}dialog h2{font-size:2rem}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:520px){main{background-position:63% center}.book{min-height:58svh}footer{bottom:1.5rem}}
#subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;max-width:33rem;margin:0}#subjects div{background:#09252de6;padding:.5rem .8rem;border-left:2px solid #d7bc7e}dt{color:#f2d28e}dd{margin:0;font-size:.87rem}.illustrated p{max-width:31rem;text-shadow:0 1px 4px #000}
</style>
<main><header><strong>✧ 星界档案馆</strong><button id="gear" aria-label="打开设置">⚙</button></header>
<section id="cover"><small>MULTIVERSE TOWER DEFENSE</small><h1>星界守望</h1><p>多元宇宙塔防</p><button class="start" id="start">开始游戏</button></section>
<section id="book" class="book" aria-live="polite" hidden><small id="eyebrow"></small><h2 id="heading" tabindex="-1"></h2><p id="description"></p><dl id="subjects" hidden><div><dt>物理</dt><dd>电磁线圈塔</dd></div><div><dt>化学</dt><dd>晶格反应塔</dd></div><div><dt>生物</dt><dd>共生树塔</dd></div><div><dt>计算机科学与技术</dt><dd>算法阵列塔</dd></div></dl><button class="entry" id="entry">第一平行宇宙 · 科学纪元</button></section>
<footer><button class="navbtn" id="prev" hidden>上一页</button><span id="counter">宇宙图鉴 ／ 封面</span><button class="navbtn" id="next" hidden>下一页</button></footer>
<dialog id="settings"><h2>设置</h2><label>音效音量 <output id="volText"></output><input type="range" id="volume" min="0" max="100"></label><label>画面亮度 <output id="lightText"></output><input type="range" id="brightness" min="45" max="120"></label><form method="dialog"><button class="navbtn">完成</button></form></dialog></main>
<script>
const byId = id => document.getElementById(id);
const pages = [
  ['UNIVERSE INDEX', '平行宇宙目录', '选择一个宇宙，展开它的篇章。'],
  ['UNIVERSE Ⅰ', '科学纪元', '第一平行宇宙 · 高耸的感应塔捕捉星际电流，守护通往核心的最后一条航道。'],
  ['NEXT UNIVERSE', '敬请期待', '下一座宇宙的星门尚未开启。']
];
let page = -1;
let audio;
function chime() {
  try {
    audio ??= new AudioContext();
    audio.resume().catch(() => {});
    const tone = audio.createOscillator(), gain = audio.createGain();
    tone.frequency.value = 392;
    gain.gain.setValueAtTime(Number(byId('volume').value) * .0009, audio.currentTime);
    gain.gain.linearRampToValueAtTime(0, audio.currentTime + .23);
    tone.connect(gain).connect(audio.destination);
    tone.start(); tone.stop(audio.currentTime + .24);
  } catch {}
}
function show(index) {
  if (index < -1 || index >= pages.length) return;
  const forward = index > page;
  page = index; chime();
  const onCover = page === -1;
  byId('cover').hidden = !onCover;
  for (const id of ['book','prev','next']) byId(id).hidden = onCover;
  byId('counter').textContent = onCover ? '宇宙图鉴 ／ 封面' : (page + 1) + ' ／ 3';
  if (onCover) { byId('start').focus(); return; }
  ['eyebrow','heading','description'].forEach((id,i) => byId(id).textContent = pages[page][i]);
  byId('subjects').hidden = page !== 1;
  byId('entry').hidden = page !== 0;
  byId('next').disabled = page === 2;
  byId('prev').textContent = page === 0 ? '返回封面' : '上一页';
  const book = byId('book');
  book.className = page === 1 ? 'book illustrated' : 'book';
  void book.offsetWidth;
  book.classList.add(forward ? 'forward' : 'back');
  byId('heading').focus({preventScroll:true});
}
byId('start').onclick = () => show(0);
byId('entry').onclick = () => show(1);
byId('prev').onclick = () => show(page - 1);
byId('next').onclick = () => show(page + 1);
byId('gear').onclick = () => byId('settings').showModal();
for (const [id, output, initial] of [['volume','volText',55],['brightness','lightText',100]]) {
  const slider = byId(id);
  slider.value = initial;
  try { slider.value = localStorage.getItem('atlas.' + id) ?? initial; } catch {}
  function apply() {
    byId(output).textContent = slider.value + '%';
    if (id === 'brightness') document.documentElement.style.filter = 'brightness(' + slider.value + '%)';
  }
  apply();
  slider.oninput = () => { apply(); try { localStorage.setItem('atlas.' + id, slider.value); } catch {} };
}
byId('volume').onchange = chime;
</script></html>
