<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>科学纪元 · 星界守望</title>
<link rel="stylesheet" href="theme.css">
<style>
html, body {
  height: 100%;
  overflow: hidden;
}

.game-shell {
  height: 100svh;
  max-width: 1120px;
  margin: 0 auto;
  padding: 12px clamp(12px, 2.5vw, 24px) 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ---------- Top HUD ---------- */
.hud-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.hud-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.stat-strip {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  padding: 6px 14px;
  background: var(--card);
  border: var(--border);
  border-radius: 999px;
  box-shadow: var(--shadow-sm);
  font-weight: 900;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

.stat-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.stat-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1.8px solid var(--ink);
}
.stat-dot.energy { background: var(--lab-amber); }
.stat-dot.hp { background: var(--lab-coral); }
.stat-dot.wave { background: var(--lab-teal); }

.ctrl-pill {
  padding: 7px 12px;
  background: var(--card);
  border: var(--border);
  border-radius: 11px;
  box-shadow: var(--shadow-sm);
  font-weight: 800;
  font-size: 13px;
  transition: transform 0.1s, box-shadow 0.1s, background 0.12s;
}
.ctrl-pill:hover { background: #fff7e2; transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); }
.ctrl-pill:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.ctrl-pill.active { background: var(--lab-amber); }

.btn-wave {
  padding: 8px 16px;
  background: var(--lab-teal);
  color: #fffdf8;
  border: var(--border);
  border-radius: 11px;
  box-shadow: var(--shadow-sm);
  font-weight: 900;
  font-size: 13.5px;
  transition: transform 0.1s, box-shadow 0.1s, filter 0.12s;
}
.btn-wave:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); }
.btn-wave:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn-wave:disabled { background: #c9c2b4; color: #5b626c; cursor: default; box-shadow: 0 2px 0 var(--ink); }

/* ---------- Board Stage ---------- */
.stage-wrap {
  position: relative;
  flex: 1;
  min-height: 0;
  background: #e5f0ec;
  border: 3px solid var(--ink);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}

#gameCanvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Boss Bar (top-center inside board) */
.boss-bar {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: min(440px, 86%);
  padding: 8px 12px;
  background: var(--card);
  border: 2.5px solid var(--ink);
  border-radius: 13px;
  box-shadow: var(--shadow-sm);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s ease;
}
.boss-bar.show { opacity: 1; }

.boss-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12.5px;
  font-weight: 900;
  margin-bottom: 5px;
}
.boss-phase { color: var(--lab-coral); font-size: 11.5px; }

.boss-track {
  position: relative;
  height: 10px;
  background: #e6dfd1;
  border: 2px solid var(--ink);
  border-radius: 999px;
  overflow: hidden;
}
.boss-fill {
  height: 100%;
  width: 100%;
  background: var(--lab-coral);
  transition: width 0.12s linear;
}
.boss-shield {
  position: absolute;
  inset: 0;
  background: rgba(111, 209, 92, 0.55);
  opacity: 0;
  transition: opacity 0.2s;
}
.boss-shield.active { opacity: 1; }

/* Wave Toast */
.wave-toast {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translate(-50%, -8px);
  padding: 6px 16px;
  background: var(--lab-amber);
  border: 2.5px solid var(--ink);
  border-radius: 999px;
  box-shadow: var(--shadow-sm);
  font-weight: 900;
  font-size: 13.5px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
}
.wave-toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Bottom Control Dock ---------- */
.hud-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.tower-dock {
  display: flex;
  gap: 8px;
  flex-wrap: nowrap;
  overflow-x: auto;
  padding-bottom: 2px;
}

.tower-btn {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 11px;
  background: var(--card);
  border: var(--border);
  border-radius: 13px;
  box-shadow: var(--shadow-sm);
  text-align: left;
  flex: none;
  transition: transform 0.1s, box-shadow 0.1s, background 0.12s;
}
.tower-btn:hover { background: #fff7e2; transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); }
.tower-btn.selected { background: #fff0c2; transform: translateY(-2px); box-shadow: 0 5px 0 var(--ink); }
.tower-btn.poor { opacity: 0.52; }

.tower-ico {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  border: 2px solid var(--ink);
  display: grid;
  place-items: center;
  flex: none;
}
.tower-ico svg { width: 24px; height: 24px; }
.tower-ico.teal { background: #daf2ec; }
.tower-ico.amber { background: #fff0c7; }
.tower-ico.green { background: #e1f5dc; }
.tower-ico.blue { background: #dfebfc; }

.tower-name { display: block; font-weight: 900; font-size: 13px; line-height: 1.15; }
.tower-cost { display: block; font-size: 11.5px; font-weight: 800; color: var(--ink-soft); margin-top: 2px; }

.action-bar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  min-width: 240px;
  padding: 8px 12px;
  background: var(--card);
  border: var(--border);
  border-radius: 13px;
  box-shadow: var(--shadow-sm);
  font-size: 12.5px;
  font-weight: 800;
  color: var(--ink-soft);
}

.action-bar .sel-label {
  color: var(--ink);
  margin-right: auto;
  white-space: nowrap;
}

.mini-btn {
  padding: 5px 11px;
  border: 2px solid var(--ink);
  border-radius: 8px;
  background: var(--lab-amber);
  color: var(--ink);
  font-weight: 900;
  font-size: 12px;
  white-space: nowrap;
}
.mini-btn:disabled { opacity: 0.4; cursor: default; }
.mini-btn.sell { background: #fde3dc; color: #9c2b1b; }

/* End Modal */
.end-overlay {
  position: absolute;
  inset: 0;
  background: rgba(27, 34, 44, 0.45);
  display: grid;
  place-items: center;
  padding: 16px;
  z-index: 10;
}
.end-overlay[hidden] { display: none; }

.end-card {
  width: min(360px, 92%);
  padding: 22px 24px;
  background: var(--card);
  border: 3px solid var(--ink);
  border-radius: var(--radius-lg);
  box-shadow: 0 8px 0 var(--ink);
  text-align: center;
}
.end-card h2 {
  margin: 0 0 8px;
  font-family: var(--font-display);
  font-size: 1.65rem;
  font-weight: 900;
}
.end-card p {
  margin: 0 0 18px;
  color: var(--ink-soft);
  font-size: 13.5px;
  font-weight: 700;
}
.end-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
}

@media (max-width: 820px) {
  .hud-bottom { flex-direction: column; align-items: stretch; }
  .action-bar { min-width: 0; justify-content: space-between; }
}
</style>
</head>
<body>
<div class="game-shell">
  <header class="hud-top">
    <div class="hud-group">
      <a class="pill-btn" href="universe-science.html">← 返回</a>
      <div class="stat-strip" aria-label="战局状态">
        <span class="stat-item"><span class="stat-dot energy"></span><span id="energyVal">220</span></span>
        <span class="stat-item"><span class="stat-dot hp"></span><span id="hpVal">20</span></span>
        <span class="stat-item"><span class="stat-dot wave"></span><span id="waveVal">0 / 6</span></span>
      </div>
    </div>
    <div class="hud-group">
      <button class="ctrl-pill" id="speedBtn">1×</button>
      <button class="ctrl-pill" id="muteBtn">音效 开</button>
      <button class="btn-wave" id="nextWaveBtn">开始第 1 波</button>
    </div>
  </header>

  <main class="stage-wrap">
    <canvas id="gameCanvas"></canvas>

    <div class="boss-bar" id="bossBar">
      <div class="boss-meta">
        <span>失控反应釜</span>
        <span class="boss-phase" id="bossPhase">阶段 1 · 产怪</span>
      </div>
      <div class="boss-track">
        <div class="boss-fill" id="bossFill"></div>
        <div class="boss-shield" id="bossShield"></div>
      </div>
    </div>

    <div class="wave-toast" id="waveToast"></div>

    <div class="end-overlay" id="endOverlay" hidden>
      <div class="end-card">
        <h2 id="endTitle">防守成功</h2>
        <p id="endDesc"></p>
        <div class="end-actions">
          <button class="btn-game teal" id="restartBtn">再来一局</button>
          <a class="btn-game ghost" href="index.html">返回大厅</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="hud-bottom">
    <div class="tower-dock" id="towerDock">
      <button class="tower-btn selected" data-tower="physics" title="快捷键 1">
        <span class="tower-ico teal"><svg viewBox="0 0 36 36" fill="none" stroke="#1b222c" stroke-width="2.2" stroke-linecap="round"><rect x="12" y="18" width="12" height="13" rx="3" fill="#fffdf8"/><ellipse cx="18" cy="18" rx="11" ry="4" fill="#f4b731"/><circle cx="18" cy="10" r="5" fill="#63c5da"/></svg></span>
        <span><span class="tower-name">电磁线圈塔</span><span class="tower-cost">70 能量</span></span>
      </button>
      <button class="tower-btn" data-tower="chemistry" title="快捷键 2">
        <span class="tower-ico amber"><svg viewBox="0 0 36 36" fill="none" stroke="#1b222c" stroke-width="2.2" stroke-linejoin="round"><path d="M13 6h10m-8 0v8l-7 13a3 3 0 0 0 3 4h14a3 3 0 0 0 3-4l-7-13V6" fill="#fffdf8"/><path d="M10 23h16l2 5a2 2 0 0 1-2 3H10a2 2 0 0 1-2-3z" fill="#f48442"/></svg></span>
        <span><span class="tower-name">晶格反应塔</span><span class="tower-cost">80 能量</span></span>
      </button>
      <button class="tower-btn" data-tower="biology" title="快捷键 3">
        <span class="tower-ico green"><svg viewBox="0 0 36 36" fill="none" stroke="#1b222c" stroke-width="2.2"><rect x="15" y="20" width="6" height="11" rx="2" fill="#a67c52"/><circle cx="12" cy="17" r="6" fill="#6fd15c"/><circle cx="24" cy="17" r="6" fill="#6fd15c"/><circle cx="18" cy="11" r="7" fill="#8ce079"/></svg></span>
        <span><span class="tower-name">共生树塔</span><span class="tower-cost">75 能量</span></span>
      </button>
      <button class="tower-btn" data-tower="compute" title="快捷键 4">
        <span class="tower-ico blue"><svg viewBox="0 0 36 36" fill="none" stroke="#1b222c" stroke-width="2.2"><polygon points="18,5 30,18 18,31 6,18" fill="#f4b731"/><circle cx="18" cy="18" r="5" fill="#fffdf8"/><circle cx="18" cy="18" r="2" fill="#3b7dd8"/></svg></span>
        <span><span class="tower-name">算法阵列塔</span><span class="tower-cost">90 能量</span></span>
      </button>
    </div>

    <div class="action-bar" id="actionBar">
      <span class="sel-label" id="actionTip">点击空位建造 · 电磁甩铁球 / 化学引爆气泡</span>
      <button class="mini-btn" id="upgradeBtn" hidden>升级</button>
      <button class="mini-btn sell" id="sellBtn" hidden>拆除</button>
    </div>
  </footer>
</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const byId = id => document.getElementById(id);

  try {
    const b = localStorage.getItem('atlas.brightness');
    if (b) document.documentElement.style.filter = `brightness(${b}%)`;
  } catch {}

  // ---------- Clean Top-Down Lab Board (12 x 8) ----------
  const COLS = 12;
  const ROWS = 8;

  const PATH = [
    { x: 0, y: 2 },
    { x: 3, y: 2 },
    { x: 3, y: 5 },
    { x: 6, y: 5 },
    { x: 6, y: 2 },
    { x: 9, y: 2 },
    { x: 9, y: 6 },
    { x: 11, y: 6 }
  ];

  const PADS = [
    { x: 2, y: 1 }, { x: 4, y: 1 }, { x: 2, y: 4 }, { x: 4, y: 4 },
    { x: 5, y: 6 }, { x: 7, y: 4 }, { x: 8, y: 1 }, { x: 8, y: 4 },
    { x: 10, y: 3 }, { x: 10, y: 5 }
  ];

  const TOWERS = {
    physics:   { name: '电磁线圈塔', cost: 70, upgradeCost: [90, 130], range: 2.75, rate: 1.05, dmg: 26, color: '#2ea8b8', tip: '吸甩失控铁球，电弧可引爆气泡' },
    chemistry: { name: '晶格反应塔', cost: 80, upgradeCost: [100, 145], range: 2.6,  rate: 0.95, dmg: 30, color: '#e8624a', tip: '酸液腐蚀铁球护甲，烈焰连爆气泡' },
    biology:   { name: '共生树塔',   cost: 75, upgradeCost: [95, 135], range: 2.7,  rate: 1.2,  dmg: 18, color: '#4cb850', tip: '感染减速，史莱姆分裂时继续传染' },
    compute:   { name: '算法阵列塔', cost: 90, upgradeCost: [110, 155], range: 3.6,  rate: 1.5,  dmg: 16, color: '#3b7dd8', tip: '优先锁定蘑菇与 Boss，易伤 +45%' }
  };

  const ENEMIES = {
    slime:     { name: '酸液史莱姆', hp: 95,   speed: 1.15, armor: 0,    reward: 16, radius: 13, color: '#6fd15c', split: true },
    miniSlime: { name: '小史莱姆',   hp: 38,   speed: 1.55, armor: 0,    reward: 6,  radius: 9,  color: '#8ee07d', split: false },
    ironball:  { name: '失控铁球',   hp: 290,  speed: 0.62, armor: 0.7,  reward: 32, radius: 16, color: '#6d7888', magnetic: true },
    bubble:    { name: '不稳定气泡', hp: 62,   speed: 1.85, armor: 0,    reward: 18, radius: 12, color: '#f9825c', volatile: true },
    mushroom:  { name: '变异蘑菇',   hp: 175,  speed: 0.85, armor: 0.15, reward: 30, radius: 15, color: '#c9795b', aura: true },
    boss:      { name: '失控反应釜', hp: 2800, speed: 0.36, armor: 0.25, reward: 300, radius: 26, color: '#9c422c', isBoss: true }
  };

  const WAVES = [
    { label: '第 1 波 · 酸液史莱姆', groups: [{ type: 'slime', count: 7, gap: 1.1 }] },
    { label: '第 2 波 · 铁球与易爆气泡', groups: [{ type: 'ironball', count: 2, gap: 2.1 }, { type: 'bubble', count: 6, gap: 0.75 }, { type: 'slime', count: 4, gap: 0.95 }] },
    { label: '第 3 波 · 变异蘑菇护盾', groups: [{ type: 'mushroom', count: 2, gap: 2.3 }, { type: 'slime', count: 6, gap: 0.85 }, { type: 'ironball', count: 2, gap: 2.0 }] },
    { label: '第 4 波 · 高速气泡群', groups: [{ type: 'bubble', count: 10, gap: 0.55 }, { type: 'ironball', count: 3, gap: 1.8 }, { type: 'mushroom', count: 2, gap: 2.2 }] },
    { label: '第 5 波 · 实验体混编', groups: [{ type: 'ironball', count: 3, gap: 1.6 }, { type: 'mushroom', count: 3, gap: 1.7 }, { type: 'slime', count: 8, gap: 0.75 }, { type: 'bubble', count: 8, gap: 0.5 }] },
    { label: '最终波 · 失控反应釜', groups: [{ type: 'mushroom', count: 2, gap: 2.2 }, { type: 'boss', count: 1, gap: 2.5 }, { type: 'ironball', count: 2, gap: 3.0 }] }
  ];

  // ---------- Viewport / Grid Geometry ----------
  let W = 0, H = 0, CELL = 64, OX = 0, OY = 0;

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width;
    H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const padX = 28, padY = 24;
    CELL = Math.max(34, Math.min((W - padX * 2) / COLS, (H - padY * 2) / ROWS));
    OX = (W - COLS * CELL) * 0.5;
    OY = (H - ROWS * CELL) * 0.5;
  }
  window.addEventListener('resize', resize);
  resize();

  const toScreen = (gx, gy) => ({ x: OX + (gx + 0.5) * CELL, y: OY + (gy + 0.5) * CELL });

  // ---------- State ----------
  let state = 'playing'; // playing | victory | defeat
  let energy = 220;
  let coreHp = 20;
  let waveIdx = 0;
  let waveActive = false;
  let gameSpeed = 1;
  let muted = false;
  let selectedTool = 'physics';
  let selectedTower = null;
  let hoverPad = null;

  const towers = [];
  const enemies = [];
  const projectiles = [];
  const particles = [];
  const floatTexts = [];
  let spawnQueue = [];
  let spawnTimer = 0;
  let toastTimer = 0;
  let shakeTime = 0;
  let shakeMag = 0;
  let nextEnemyId = 1;

  // ---------- Crisp Toy SFX ----------
  let audioCtx;
  function getVol() {
    if (muted) return 0;
    try { return Number(localStorage.getItem('atlas.volume') ?? 55) / 100; } catch { return 0.55; }
  }

  function playSfx(kind) {
    const v = getVol();
    if (!v) return;
    try {
      audioCtx ??= new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      if (kind === 'build') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(560, now + 0.08);
        gain.gain.setValueAtTime(0.14 * v, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.13);
      } else if (kind === 'wave') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(587, now + 0.09);
        gain.gain.setValueAtTime(0.15 * v, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.3);
      } else if (kind === 'boom') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.24);
        gain.gain.setValueAtTime(0.18 * v, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.26);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.28);
      } else if (kind === 'zap') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(720, now);
        osc.frequency.exponentialRampToValueAtTime(280, now + 0.09);
        gain.gain.setValueAtTime(0.09 * v, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.11);
      } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.06);
        gain.gain.setValueAtTime(0.07 * v, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.08);
      }
    } catch {}
  }

  // ---------- Helpers ----------
  function showToast(text) {
    const el = byId('waveToast');
    el.textContent = text;
    el.classList.add('show');
    toastTimer = 2.2;
  }

  function addShake(mag, dur = 0.2) {
    shakeMag = Math.max(shakeMag, mag);
    shakeTime = Math.max(shakeTime, dur);
  }

  function addFloat(gx, gy, text, color = '#1b222c') {
    const p = toScreen(gx, gy);
    floatTexts.push({ x: p.x, y: p.y - 14, text, color, life: 1.0, maxLife: 1.0 });
  }

  function spawnBurst(gx, gy, color, count = 12, speed = 85) {
    const p = toScreen(gx, gy);
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = speed * (0.35 + Math.random() * 0.85);
      particles.push({
        x: p.x, y: p.y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20,
        r: 2.5 + Math.random() * 3.5,
        color, life: 0.35 + Math.random() * 0.3, maxLife: 0.65
      });
    }
  }

  function updateHud() {
    byId('energyVal').textContent = Math.floor(energy);
    byId('hpVal').textContent = Math.max(0, coreHp);
    byId('waveVal').textContent = `${waveIdx} / ${WAVES.length}`;

    document.querySelectorAll('.tower-btn').forEach(btn => {
      const type = btn.dataset.tower;
      btn.classList.toggle('selected', !selectedTower && selectedTool === type);
      btn.classList.toggle('poor', energy < TOWERS[type].cost);
    });

    const nextBtn = byId('nextWaveBtn');
    if (waveIdx >= WAVES.length) {
      nextBtn.disabled = true;
      nextBtn.textContent = waveActive ? '最终波进行中' : '全部完成';
    } else if (waveActive) {
      nextBtn.disabled = true;
      nextBtn.textContent = `第 ${waveIdx} 波进行中`;
    } else {
      nextBtn.disabled = false;
      nextBtn.textContent = waveIdx === 0 ? '开始第 1 波' : `下一波 (${waveIdx + 1}/${WAVES.length})`;
    }

    const tip = byId('actionTip');
    const upBtn = byId('upgradeBtn');
    const sellBtn = byId('sellBtn');

    if (selectedTower) {
      const spec = TOWERS[selectedTower.type];
      tip.textContent = `${spec.name} Lv.${selectedTower.level} · 攻 ${Math.round(selectedTower.dmg)}`;
      upBtn.hidden = false;
      sellBtn.hidden = false;
      if (selectedTower.level >= 3) {
        upBtn.disabled = true;
        upBtn.textContent = '已满级';
      } else {
        const upCost = spec.upgradeCost[selectedTower.level - 1];
        upBtn.disabled = energy < upCost;
        upBtn.textContent = `升级 (${upCost})`;
      }
      sellBtn.textContent = `拆除 +${Math.round(selectedTower.invested * 0.7)}`;
    } else {
      const spec = TOWERS[selectedTool];
      tip.textContent = `${spec.name}：${spec.tip}`;
      upBtn.hidden = true;
      sellBtn.hidden = true;
    }

    const boss = enemies.find(e => e.isBoss && !e.dead);
    const bar = byId('bossBar');
    if (boss) {
      bar.classList.add('show');
      byId('bossFill').style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;
      byId('bossShield').classList.toggle('active', boss.shieldTimer > 0);
      const phases = ['阶段 1 · 产怪', '阶段 2 · 喷泡', '阶段 3 · 孢子盾', '阶段 4 · 临界解体'];
      byId('bossPhase').textContent = phases[boss.phase - 1];
    } else {
      bar.classList.remove('show');
    }
  }

  // ---------- Gameplay ----------
  function startNextWave() {
    if (state !== 'playing' || waveActive || waveIdx >= WAVES.length) return;
    const wave = WAVES[waveIdx];
    waveIdx++;
    waveActive = true;
    spawnQueue = [];
    for (const g of wave.groups) {
      for (let i = 0; i < g.count; i++) {
        spawnQueue.push({ type: g.type, delay: i === 0 ? 0.35 : g.gap });
      }
    }
    spawnTimer = 0.25;
    playSfx('wave');
    showToast(wave.label);
    updateHud();
  }

  function createEnemy(type, segIdx = 0, segT = 0, inherited = null) {
    const spec = ENEMIES[type];
    const a = PATH[segIdx], b = PATH[Math.min(PATH.length - 1, segIdx + 1)];
    const mult = spec.isBoss ? 1 : (1 + (waveIdx - 1) * 0.09);
    const e = {
      id: nextEnemyId++,
      type,
      hp: spec.hp * mult,
      maxHp: spec.hp * mult,
      speed: spec.speed,
      baseArmor: spec.armor,
      reward: spec.reward,
      radius: spec.radius,
      color: spec.color,
      split: !!spec.split,
      magnetic: !!spec.magnetic,
      volatile: !!spec.volatile,
      aura: !!spec.aura,
      isBoss: !!spec.isBoss,
      seg: segIdx,
      t: segT,
      x: a.x + (b.x - a.x) * segT,
      y: a.y + (b.y - a.y) * segT,
      progress: segIdx + segT,
      corroded: 0,
      infected: inherited?.infected || 0,
      infectedDps: inherited?.infectedDps || 0,
      marked: 0,
      flingTimer: 0,
      flingCooldown: 0,
      auraBuff: false,
      phase: 1,
      bossSpawnCd: 4.4,
      bossBubbleDamage: 0,
      shieldTimer: 0,
      p3Triggered: false,
      dead: false
    };
    enemies.push(e);
    return e;
  }

  function triggerBubbleExplosion(source) {
    if (source.dead) return;
    source.dead = true;
    energy += source.reward;
    playSfx('boom');
    addShake(6, 0.22);
    spawnBurst(source.x, source.y, '#f9825c', 18, 120);
    addFloat(source.x, source.y, '连锁引爆!', '#d94d26');

    for (const other of enemies) {
      if (other.dead || other.id === source.id) continue;
      if (Math.hypot(other.x - source.x, other.y - source.y) <= 2.0) {
        if (other.volatile) setTimeout(() => triggerBubbleExplosion(other), 85);
        else damageEnemy(other, 95, 'fire');
      }
    }
  }

  function damageEnemy(e, rawDmg, elem = 'normal') {
    if (e.dead) return;
    const armor = e.corroded > 0 ? Math.min(e.baseArmor, 0.15) : e.baseArmor;
    let mult = 1 - armor;
    if (e.auraBuff && !e.aura) mult *= 0.55;
    if (e.isBoss && e.shieldTimer > 0) mult *= 0.45;
    if (e.marked > 0) mult *= 1.45;

    const dmg = Math.max(2, rawDmg * mult);
    e.hp -= dmg;

    if (e.isBoss && e.phase === 2) {
      e.bossBubbleDamage += dmg;
      if (e.bossBubbleDamage >= 260) {
        e.bossBubbleDamage = 0;
        createEnemy('bubble', e.seg, Math.max(0, e.t - 0.14));
        createEnemy('bubble', e.seg, Math.min(0.94, e.t + 0.14));
        addFloat(e.x, e.y, '喷出气泡!', '#e8624a');
      }
    }

    if (e.volatile && (elem === 'fire' || elem === 'electric')) {
      triggerBubbleExplosion(e);
      return;
    }

    if (e.hp <= 0) killEnemy(e);
  }

  function killEnemy(e) {
    if (e.dead) return;
    e.dead = true;
    energy += e.reward;
    spawnBurst(e.x, e.y, e.color, e.isBoss ? 34 : 10, e.isBoss ? 140 : 75);

    if (e.split) {
      const spread = e.infected > 0 ? { infected: Math.max(4, e.infected), infectedDps: Math.max(14, e.infectedDps) } : null;
      createEnemy('miniSlime', e.seg, Math.max(0, e.t - 0.12), spread);
      createEnemy('miniSlime', e.seg, Math.min(0.95, e.t + 0.12), spread);
      if (spread) addFloat(e.x, e.y, '分裂传染!', '#2f8f37');
    }

    if (e.isBoss) {
      playSfx('boom');
      addShake(10, 0.4);
      addFloat(e.x, e.y, '反应釜解体!', '#e8624a');
      for (let i = 0; i < 4; i++) {
        createEnemy(i % 2 === 0 ? 'miniSlime' : 'bubble', e.seg, Math.max(0.05, Math.min(0.95, e.t + (i - 1.5) * 0.12)));
      }
    }
    updateHud();
  }

  function placeTower(pad) {
    const spec = TOWERS[selectedTool];
    if (energy < spec.cost) {
      addFloat(pad.x, pad.y, '能量不足', '#c94a34');
      return;
    }
    energy -= spec.cost;
    const t = {
      x: pad.x, y: pad.y, type: selectedTool, level: 1,
      invested: spec.cost, range: spec.range, rate: spec.rate, dmg: spec.dmg,
      cd: 0.1, pulse: 0
    };
    towers.push(t);
    selectedTower = t;
    playSfx('build');
    spawnBurst(pad.x, pad.y, spec.color, 10, 60);
    updateHud();
  }

  function upgradeSelected() {
    if (!selectedTower || selectedTower.level >= 3) return;
    const spec = TOWERS[selectedTower.type];
    const cost = spec.upgradeCost[selectedTower.level - 1];
    if (energy < cost) return;
    energy -= cost;
    selectedTower.invested += cost;
    selectedTower.level++;
    selectedTower.dmg *= 1.42;
    selectedTower.range += 0.35;
    selectedTower.rate *= 1.12;
    playSfx('build');
    spawnBurst(selectedTower.x, selectedTower.y, '#f4b731', 14, 75);
    addFloat(selectedTower.x, selectedTower.y, `Lv.${selectedTower.level}`, '#b57b00');
    updateHud();
  }

  function sellSelected() {
    if (!selectedTower) return;
    const refund = Math.round(selectedTower.invested * 0.7);
    energy += refund;
    const idx = towers.indexOf(selectedTower);
    if (idx >= 0) towers.splice(idx, 1);
    addFloat(selectedTower.x, selectedTower.y, `+${refund}`, '#1d8a78');
    selectedTower = null;
    playSfx('hit');
    updateHud();
  }

  function finishGame(won) {
    state = won ? 'victory' : 'defeat';
    playSfx(won ? 'wave' : 'boom');
    byId('endTitle').textContent = won ? '防守成功' : '核心受损';
    byId('endDesc').textContent = won
      ? `成功击破「失控反应釜」，核心剩余耐久 ${coreHp} / 20。`
      : `防线在第 ${waveIdx} 波被突破。试试电磁甩铁球、化学引爆气泡、算法标记蘑菇。`;
    byId('endOverlay').hidden = false;
    updateHud();
  }

  function resetGame() {
    energy = 220;
    coreHp = 20;
    waveIdx = 0;
    waveActive = false;
    spawnQueue = [];
    towers.length = 0;
    enemies.length = 0;
    projectiles.length = 0;
    particles.length = 0;
    floatTexts.length = 0;
    selectedTower = null;
    state = 'playing';
    byId('endOverlay').hidden = true;
    updateHud();
  }

  // ---------- Update ----------
  function update(dt) {
    if (toastTimer > 0) {
      toastTimer -= dt;
      if (toastTimer <= 0) byId('waveToast').classList.remove('show');
    }
    if (shakeTime > 0) {
      shakeTime = Math.max(0, shakeTime - dt);
      if (shakeTime === 0) shakeMag = 0;
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const f = floatTexts[i];
      f.y -= 26 * dt; f.life -= dt;
      if (f.life <= 0) floatTexts.splice(i, 1);
    }

    if (state !== 'playing') return;
    const sdt = dt * gameSpeed;

    if (waveActive && spawnQueue.length > 0) {
      spawnTimer -= sdt;
      if (spawnTimer <= 0) {
        const next = spawnQueue.shift();
        createEnemy(next.type);
        spawnTimer = spawnQueue[0] ? spawnQueue[0].delay : 0;
      }
    }

    for (const e of enemies) e.auraBuff = false;
    for (const m of enemies) {
      if (m.dead || !m.aura) continue;
      for (const ally of enemies) {
        if (ally.dead || ally.id === m.id) continue;
        if (Math.hypot(ally.x - m.x, ally.y - m.y) <= 2.1) ally.auraBuff = true;
      }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.dead) { enemies.splice(i, 1); continue; }

      if (e.corroded > 0) e.corroded -= sdt;
      if (e.marked > 0) e.marked -= sdt;
      if (e.flingCooldown > 0) e.flingCooldown -= sdt;
      if (e.shieldTimer > 0) e.shieldTimer -= sdt;

      if (e.infected > 0) {
        e.infected -= sdt;
        damageEnemy(e, e.infectedDps * sdt, 'bio');
        if (e.dead) continue;
      }

      if (e.isBoss) {
        const pct = e.hp / e.maxHp;
        if (pct <= 0.1) e.phase = 4;
        else if (pct <= 0.35) {
          e.phase = 3;
          if (!e.p3Triggered) {
            e.p3Triggered = true;
            e.shieldTimer = 9;
            createEnemy('mushroom', e.seg, Math.max(0, e.t - 0.1));
            addFloat(e.x, e.y, '孢子护盾!', '#2f8f37');
          }
        } else if (pct <= 0.7) e.phase = 2;

        if (e.phase === 1) {
          e.bossSpawnCd -= sdt;
          if (e.bossSpawnCd <= 0) {
            e.bossSpawnCd = 4.2;
            createEnemy('slime', e.seg, Math.min(0.95, e.t + 0.08));
          }
        }
      }

      const slow = e.infected > 0 ? 0.74 : 1;
      let move = e.speed * slow * sdt;
      if (e.flingTimer > 0) {
        e.flingTimer -= sdt;
        move = -2.8 * sdt;
        for (const other of enemies) {
          if (other.dead || other.id === e.id) continue;
          if (Math.hypot(other.x - e.x, other.y - e.y) < 0.65) {
            damageEnemy(other, 48 * sdt * 6, 'physical');
          }
        }
      }

      const a = PATH[e.seg], b = PATH[e.seg + 1];
      const segLen = Math.hypot(b.x - a.x, b.y - a.y);
      e.t += move / segLen;

      if (e.t < 0) {
        if (e.seg > 0) { e.seg--; e.t += 1; }
        else e.t = 0;
      } else if (e.t >= 1) {
        e.seg++; e.t -= 1;
        if (e.seg >= PATH.length - 1) {
          coreHp -= e.isBoss ? 10 : 1;
          e.dead = true;
          playSfx('boom');
          addShake(7, 0.25);
          spawnBurst(11, 6, '#e8624a', 14, 90);
          updateHud();
          if (coreHp <= 0) finishGame(false);
          continue;
        }
      }

      const p1 = PATH[e.seg], p2 = PATH[e.seg + 1];
      e.x = p1.x + (p2.x - p1.x) * e.t;
      e.y = p1.y + (p2.y - p1.y) * e.t;
      e.progress = e.seg + e.t;
    }

    for (const t of towers) {
      t.pulse = Math.max(0, t.pulse - sdt * 3);
      t.cd -= sdt;
      if (t.cd > 0) continue;

      let target = null, best = -1;
      for (const e of enemies) {
        if (e.dead) continue;
        if (Math.hypot(e.x - t.x, e.y - t.y) > t.range) continue;
        let score = e.progress;
        if (t.type === 'compute') {
          if (e.aura) score += 20;
          if (e.isBoss) score += 16;
          if (e.marked <= 0) score += 6;
        } else if (t.type === 'physics' && e.magnetic && e.flingCooldown <= 0) score += 12;
        else if (t.type === 'chemistry' && e.volatile) score += 10;
        if (score > best) { best = score; target = e; }
      }

      if (target) {
        t.cd = 1 / t.rate;
        t.pulse = 1;
        fireTower(t, target);
      }
    }

    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      p.life -= sdt;
      if (p.instant) { if (p.life <= 0) projectiles.splice(i, 1); continue; }
      const dx = p.tx - p.x, dy = p.ty - p.y, dist = Math.hypot(dx, dy);
      const step = p.speed * sdt;
      if (dist <= step || p.life <= 0) {
        onProjectileHit(p);
        projectiles.splice(i, 1);
      } else {
        p.x += (dx / dist) * step;
        p.y += (dy / dist) * step;
      }
    }

    if (waveActive && spawnQueue.length === 0 && enemies.length === 0) {
      waveActive = false;
      const bonus = 35 + waveIdx * 10;
      energy += bonus;
      if (waveIdx >= WAVES.length) finishGame(true);
      else addFloat(11, 6, `+${bonus} 能量`, '#1d8a78');
      updateHud();
    } else if (enemies.some(e => e.isBoss)) {
      updateHud();
    }
  }

  function fireTower(t, target) {
    if (t.type === 'physics') {
      playSfx('zap');
      projectiles.push({ instant: true, x: t.x, y: t.y, tx: target.x, ty: target.y, color: '#2ea8b8', life: 0.14, maxLife: 0.14 });
      if (target.magnetic && target.flingCooldown <= 0) {
        target.flingTimer = 0.52;
        target.flingCooldown = 3.2;
        addFloat(target.x, target.y, '磁力甩击!', '#1d8a78');
        addShake(3.5, 0.14);
      }
      damageEnemy(target, t.dmg, 'electric');
    } else if (t.type === 'compute') {
      playSfx('zap');
      projectiles.push({ instant: true, x: t.x, y: t.y, tx: target.x, ty: target.y, color: '#3b7dd8', life: 0.16, maxLife: 0.16 });
      if (target.marked <= 0) addFloat(target.x, target.y, '锁定 +45%', '#3b7dd8');
      target.marked = 4.5;
      damageEnemy(target, t.dmg, 'arcane');
    } else {
      projectiles.push({
        instant: false, type: t.type, dmg: t.dmg, target,
        x: t.x, y: t.y, tx: target.x, ty: target.y,
        speed: 7.0, color: TOWERS[t.type].color, life: 1.5
      });
    }
  }

  function onProjectileHit(p) {
    const e = p.target;
    if (!e || e.dead) return;
    playSfx('hit');
    if (p.type === 'chemistry') {
      spawnBurst(e.x, e.y, '#f48442', 7, 55);
      if (e.magnetic && e.corroded <= 0) addFloat(e.x, e.y, '酸液破甲!', '#2f8f37');
      e.corroded = 5.5;
      damageEnemy(e, p.dmg, 'fire');
    } else if (p.type === 'biology') {
      spawnBurst(e.x, e.y, '#6fd15c', 6, 48);
      e.infected = 5.0;
      e.infectedDps = p.dmg * 0.72;
      damageEnemy(e, p.dmg * 0.65, 'bio');
    }
  }

  // ---------- Clean Toy-Board Rendering ----------
  function drawTower(t, now) {
    const p = toScreen(t.x, t.y);
    const pulse = t.pulse * 3;
    const r = Math.min(CELL * 0.36, 22);

    if (selectedTower === t) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(p.x, p.y, t.range * CELL, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(29, 138, 120, 0.1)';
      ctx.fill();
      ctx.strokeStyle = '#1d8a78';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 5]);
      ctx.stroke();
      ctx.restore();
    }

    // Tactile circular pedestal
    ctx.fillStyle = '#fffdf8';
    ctx.strokeStyle = '#1b222c';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(p.x, p.y + 2, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    if (t.type === 'physics') {
      ctx.fillStyle = '#fffdf8';
      ctx.fillRect(p.x - 6, p.y - 12, 12, 16);
      ctx.strokeRect(p.x - 6, p.y - 12, 12, 16);
      ctx.fillStyle = '#f4b731';
      ctx.beginPath(); ctx.ellipse(p.x, p.y - 5, 11, 4, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#63c5da';
      ctx.beginPath(); ctx.arc(p.x, p.y - 15 - pulse * 0.3, 6 + pulse * 0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (t.type === 'chemistry') {
      ctx.fillStyle = '#fffdf8';
      ctx.beginPath();
      ctx.moveTo(p.x - 10, p.y + 6); ctx.lineTo(p.x - 5, p.y - 10);
      ctx.lineTo(p.x + 5, p.y - 10); ctx.lineTo(p.x + 10, p.y + 6);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f48442';
      const fl = Math.sin(now * 0.012 + t.x) * 2;
      ctx.beginPath();
      ctx.moveTo(p.x - 6, p.y - 10);
      ctx.quadraticCurveTo(p.x, p.y - 24 - fl - pulse, p.x + 6, p.y - 10);
      ctx.fill(); ctx.stroke();
    } else if (t.type === 'biology') {
      ctx.fillStyle = '#a67c52';
      ctx.fillRect(p.x - 3.5, p.y - 3, 7, 11); ctx.strokeRect(p.x - 3.5, p.y - 3, 7, 11);
      ctx.fillStyle = '#6fd15c';
      ctx.beginPath(); ctx.arc(p.x - 7, p.y - 6, 7, 0, Math.PI * 2); ctx.arc(p.x + 7, p.y - 6, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#8ce079';
      ctx.beginPath(); ctx.arc(p.x, p.y - 12, 8 + pulse * 0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else {
      ctx.save();
      ctx.translate(p.x, p.y - 4);
      ctx.rotate(now * 0.002 + t.x);
      ctx.fillStyle = '#f4b731';
      ctx.fillRect(-9, -9, 18, 18); ctx.strokeRect(-9, -9, 18, 18);
      ctx.restore();
      ctx.fillStyle = '#3b7dd8';
      ctx.beginPath(); ctx.arc(p.x, p.y - 4, 4, 0, Math.PI * 2); ctx.fill();
    }

    // Level dots
    for (let i = 0; i < t.level; i++) {
      ctx.fillStyle = '#f4b731';
      ctx.strokeStyle = '#1b222c';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(p.x - (t.level - 1) * 4 + i * 8, p.y + r - 3, 3, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
  }

  function drawEnemy(e, now) {
    const p = toScreen(e.x, e.y);
    const bob = e.volatile ? Math.sin(now * 0.01 + e.id) * 3 : Math.abs(Math.sin(now * 0.008 + e.id)) * 2.5;
    const scale = Math.min(1.15, CELL / 58);
    const rad = e.radius * scale;

    if (e.aura) {
      ctx.strokeStyle = 'rgba(76, 184, 80, 0.45)';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.1 * CELL, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Soft ground shadow
    ctx.fillStyle = 'rgba(27, 34, 44, 0.16)';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + rad * 0.65, rad * 0.85, rad * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#1b222c';
    ctx.lineWidth = 2.2;

    if (e.isBoss) {
      const jx = e.phase === 4 ? (Math.random() - 0.5) * 3 : 0;
      const bx = p.x + jx, by = p.y - bob;
      // Legs
      ctx.beginPath();
      ctx.moveTo(bx - 12, by + 12); ctx.lineTo(bx - 16, by + 22);
      ctx.moveTo(bx + 12, by + 12); ctx.lineTo(bx + 16, by + 22);
      ctx.stroke();
      // Vessel body
      ctx.fillStyle = '#9c422c';
      ctx.beginPath(); ctx.roundRect(bx - rad, by - rad, rad * 2, rad * 1.8, 12); ctx.fill(); ctx.stroke();
      // Glass window
      ctx.fillStyle = e.phase === 3 ? '#8ce079' : '#f4b731';
      ctx.beginPath(); ctx.arc(bx, by - 2, rad * 0.48, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      if (e.shieldTimer > 0) {
        ctx.strokeStyle = '#4cb850';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(bx, by - 2, rad + 8, 0, Math.PI * 2); ctx.stroke();
      }
    } else if (e.magnetic) {
      ctx.fillStyle = e.corroded > 0 ? '#74b86a' : '#6d7888';
      ctx.beginPath(); ctx.arc(p.x, p.y - bob, rad, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fffdf8';
      ctx.beginPath(); ctx.arc(p.x - rad * 0.32, p.y - bob - rad * 0.3, rad * 0.22, 0, Math.PI * 2); ctx.fill();
    } else if (e.volatile) {
      ctx.fillStyle = '#f9825c';
      ctx.beginPath(); ctx.arc(p.x, p.y - bob, rad + Math.sin(now * 0.014 + e.id) * 1.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fffdf8';
      ctx.beginPath(); ctx.arc(p.x - rad * 0.3, p.y - bob - rad * 0.32, rad * 0.24, 0, Math.PI * 2); ctx.fill();
    } else if (e.aura) {
      ctx.fillStyle = '#fffdf8';
      ctx.fillRect(p.x - 5, p.y - bob, 10, 10); ctx.strokeRect(p.x - 5, p.y - bob, 10, 10);
      ctx.fillStyle = '#c9795b';
      ctx.beginPath(); ctx.arc(p.x, p.y - bob + 1, rad, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fffdf8';
      ctx.beginPath(); ctx.arc(p.x - 5, p.y - bob - 5, 2.3, 0, Math.PI * 2); ctx.arc(p.x + 5, p.y - bob - 4, 2, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.arc(p.x, p.y - bob + 4, rad, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#1b222c';
      ctx.beginPath(); ctx.arc(p.x - 3.5, p.y - bob - 1, 1.6, 0, Math.PI * 2); ctx.arc(p.x + 3.5, p.y - bob - 1, 1.6, 0, Math.PI * 2); ctx.fill();
    }

    if (e.marked > 0) {
      ctx.strokeStyle = '#3b7dd8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y - bob, rad + 5, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (!e.isBoss && e.hp < e.maxHp) {
      const bw = 28, bh = 5;
      ctx.fillStyle = '#fffdf8';
      ctx.fillRect(p.x - bw / 2, p.y - rad - 13, bw, bh);
      ctx.fillStyle = e.auraBuff ? '#4cb850' : '#e8624a';
      ctx.fillRect(p.x - bw / 2, p.y - rad - 13, bw * Math.max(0, e.hp / e.maxHp), bh);
      ctx.strokeStyle = '#1b222c';
      ctx.lineWidth = 1.4;
      ctx.strokeRect(p.x - bw / 2, p.y - rad - 13, bw, bh);
    }
  }

  function render(now) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#e5f0ec';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shakeTime > 0) {
      ctx.translate((Math.random() - 0.5) * shakeMag * 2, (Math.random() - 0.5) * shakeMag * 2);
    }

    // Subtle lab grid
    ctx.strokeStyle = 'rgba(27, 34, 44, 0.08)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(OX + x * CELL, OY); ctx.lineTo(OX + x * CELL, OY + ROWS * CELL); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(OX, OY + y * CELL); ctx.lineTo(OX + COLS * CELL, OY + y * CELL); ctx.stroke();
    }

    // Path track
    const pts = PATH.map(p => toScreen(p.x, p.y));
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.strokeStyle = '#1b222c';
    ctx.lineWidth = CELL * 0.64;
    ctx.stroke();
    ctx.strokeStyle = '#fffdf8';
    ctx.lineWidth = CELL * 0.54;
    ctx.stroke();

    // Moving dashed conveyor line
    ctx.save();
    ctx.setLineDash([8, 12]);
    ctx.lineDashOffset = -(now * 0.03);
    ctx.strokeStyle = '#b9d4cb';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();

    // Start portal (Petri rift)
    const startP = pts[0];
    ctx.fillStyle = '#e1f5dc';
    ctx.strokeStyle = '#1b222c';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(startP.x, startP.y, CELL * 0.34, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4cb850';
    ctx.beginPath(); ctx.arc(startP.x, startP.y, CELL * 0.16 + Math.sin(now * 0.006) * 2, 0, Math.PI * 2); ctx.fill();

    // Core Machine at end
    const endP = pts[pts.length - 1];
    ctx.fillStyle = '#fff0c2';
    ctx.strokeStyle = '#1b222c';
    ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.roundRect(endP.x - CELL * 0.36, endP.y - CELL * 0.36, CELL * 0.72, CELL * 0.72, 10); ctx.fill(); ctx.stroke();
    ctx.save();
    ctx.translate(endP.x, endP.y);
    ctx.rotate(now * 0.002);
    ctx.strokeStyle = '#e8624a';
    ctx.lineWidth = 2.6;
    for (let k = 0; k < 4; k++) { ctx.rotate(Math.PI / 2); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -CELL * 0.2); ctx.stroke(); }
    ctx.restore();
    ctx.fillStyle = '#f4b731';
    ctx.beginPath(); ctx.arc(endP.x, endP.y, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    // Tower pads
    for (const pad of PADS) {
      const p = toScreen(pad.x, pad.y);
      const occupied = towers.some(t => t.x === pad.x && t.y === pad.y);
      if (occupied) continue;
      const isHover = hoverPad === pad;
      if (isHover && !selectedTower) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, TOWERS[selectedTool].range * CELL, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(244, 183, 49, 0.14)';
        ctx.fill();
        ctx.strokeStyle = '#d89a2b';
        ctx.lineWidth = 1.8;
        ctx.setLineDash([5, 4]);
        ctx.stroke();
        ctx.restore();
      }
      ctx.fillStyle = isHover ? '#fff0c2' : '#fffdf8';
      ctx.strokeStyle = '#1b222c';
      ctx.lineWidth = 2;
      ctx.setLineDash(isHover ? [] : [4, 4]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, CELL * 0.31, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.setLineDash([]);
      // Plus sign
      ctx.strokeStyle = isHover ? '#1b222c' : '#9aa4b0';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x - 5, p.y); ctx.lineTo(p.x + 5, p.y);
      ctx.moveTo(p.x, p.y - 5); ctx.lineTo(p.x, p.y + 5);
      ctx.stroke();
    }

    for (const t of towers) drawTower(t, now);
    for (const e of enemies) if (!e.dead) drawEnemy(e, now);

    // Projectiles
    for (const p of projectiles) {
      if (p.instant) {
        const a = toScreen(p.x, p.y), b = toScreen(p.tx, p.ty);
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y - 10);
        ctx.lineTo((a.x + b.x) * 0.5 + (Math.random() - 0.5) * 10, (a.y + b.y) * 0.5 + (Math.random() - 0.5) * 10);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.restore();
      } else {
        const pos = toScreen(p.x, p.y);
        ctx.fillStyle = p.color;
        ctx.strokeStyle = '#1b222c';
        ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.arc(pos.x, pos.y, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
    }

    // Particles
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Floating combat labels
    ctx.font = '800 13px "SF Pro Rounded", "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    for (const f of floatTexts) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, f.life / f.maxLife);
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#fffdf8';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }

    ctx.restore();
  }

  // ---------- Input ----------
  function findPad(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const mx = clientX - rect.left, my = clientY - rect.top;
    let best = null, bestD = CELL * 0.48;
    for (const pad of PADS) {
      const p = toScreen(pad.x, pad.y);
      const d = Math.hypot(mx - p.x, my - p.y);
      if (d < bestD) { bestD = d; best = pad; }
    }
    return best;
  }

  canvas.addEventListener('mousemove', e => {
    hoverPad = findPad(e.clientX, e.clientY);
    canvas.style.cursor = hoverPad ? 'pointer' : 'default';
  });

  canvas.addEventListener('click', e => {
    if (state !== 'playing') return;
    const pad = findPad(e.clientX, e.clientY);
    if (!pad) { selectedTower = null; updateHud(); return; }
    const existing = towers.find(t => t.x === pad.x && t.y === pad.y);
    if (existing) { selectedTower = existing; updateHud(); }
    else placeTower(pad);
  });

  document.querySelectorAll('.tower-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedTool = btn.dataset.tower;
      selectedTower = null;
      updateHud();
    });
  });

  document.addEventListener('keydown', e => {
    if (e.key === '1') { selectedTool = 'physics'; selectedTower = null; updateHud(); }
    if (e.key === '2') { selectedTool = 'chemistry'; selectedTower = null; updateHud(); }
    if (e.key === '3') { selectedTool = 'biology'; selectedTower = null; updateHud(); }
    if (e.key === '4') { selectedTool = 'compute'; selectedTower = null; updateHud(); }
    if (e.key === ' ') { e.preventDefault(); startNextWave(); }
  });

  byId('nextWaveBtn').onclick = startNextWave;
  byId('upgradeBtn').onclick = upgradeSelected;
  byId('sellBtn').onclick = sellSelected;
  byId('restartBtn').onclick = resetGame;

  byId('speedBtn').onclick = () => {
    gameSpeed = gameSpeed === 1 ? 2 : 1;
    byId('speedBtn').textContent = `${gameSpeed}×`;
    byId('speedBtn').classList.toggle('active', gameSpeed === 2);
  };

  byId('muteBtn').onclick = () => {
    muted = !muted;
    byId('muteBtn').textContent = muted ? '音效 关' : '音效 开';
  };

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render(now);
    requestAnimationFrame(loop);
  }

  updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
